<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Haber Yönetimi | Akçaabat Haber</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .haber-yonetim {
            width: 100%;
        }

        .haber-istatistik-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .haber-istatistik {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .haber-istatistik-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .haber-istatistik-value {
            color: #222;
            font-size: 28px;
            font-weight: 800;
        }

        .haber-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: #fff;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .haber-toolbar input,
        .haber-toolbar select {
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            background: #fff;
        }

        .haber-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .haber-toolbar input:focus,
        .haber-toolbar select:focus {
            border-color: #b40018;
        }

        .haber-yeni-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border-radius: 7px;
            background: #b40018;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        .haber-yeni-btn:hover {
            background: #900014;
        }

        .haber-liste {
            display: grid;
            gap: 15px;
        }

        .haber-yonetim-card {
            display: grid;
            grid-template-columns: 180px 1fr auto;
            gap: 20px;
            align-items: center;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .haber-yonetim-gorsel {
            width: 180px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            background: #eee;
        }

        .haber-yonetim-gorsel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .haber-yonetim-bilgi {
            min-width: 0;
        }

        .haber-yonetim-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 7px;
        }

        .haber-etiket {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 5px;
            background: #f0f0f0;
            color: #555;
            font-size: 11px;
            font-weight: 800;
        }

        .haber-etiket.son-dakika {
            background: #111;
            color: #fff;
        }

        .haber-yonetim-baslik {
            margin: 0 0 8px;
            color: #222;
            font-size: 19px;
            line-height: 1.35;
        }

        .haber-yonetim-ozet {
            margin: 0 0 9px;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        .haber-yonetim-tarih {
            color: #999;
            font-size: 12px;
        }

        .haber-yonetim-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 95px;
        }

        .haber-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 0 12px;
            border: 0;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .haber-action-edit {
            background: #eee;
            color: #222;
        }

        .haber-action-view {
            background: #222;
            color: #fff;
        }

        .haber-action-delete {
            background: #b40018;
            color: #fff;
        }

        .haber-bos {
            padding: 60px 20px;
            background: #fff;
            border-radius: 12px;
            text-align: center;
            color: #777;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .haber-bos h2 {
            margin: 0 0 10px;
            color: #222;
        }

        .silme-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.55);
        }

        .silme-modal.active {
            display: flex;
        }

        .silme-modal-box {
            width: 100%;
            max-width: 430px;
            padding: 28px;
            border-radius: 14px;
            background: #fff;
            text-align: center;
        }

        .silme-modal-box h2 {
            margin: 0 0 10px;
        }

        .silme-modal-box p {
            margin: 0 0 22px;
            color: #777;
            line-height: 1.5;
        }

        .silme-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .silme-modal-actions button {
            min-height: 40px;
            padding: 0 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        #iptalSil {
            background: #eee;
            color: #222;
        }

        #onaylaSil {
            background: #b40018;
            color: #fff;
        }

        @media (max-width: 1000px) {
            .haber-istatistik-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .haber-yonetim-card {
                grid-template-columns: 140px 1fr;
            }

            .haber-yonetim-gorsel {
                width: 140px;
                height: 100px;
            }

            .haber-yonetim-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: flex-end;
            }
        }

        @media (max-width: 650px) {
            .haber-istatistik-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .haber-istatistik {
                padding: 15px;
            }

            .haber-istatistik-value {
                font-size: 23px;
            }

            .haber-yonetim-card {
                grid-template-columns: 1fr;
            }

            .haber-yonetim-gorsel {
                width: 100%;
                height: 190px;
            }

            .haber-yonetim-actions {
                grid-column: auto;
                flex-direction: row;
                justify-content: stretch;
            }

            .haber-action-btn {
                flex: 1;
            }

            .haber-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .haber-toolbar input,
            .haber-toolbar select,
            .haber-yeni-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         ADMIN HEADER
         ===================================================== -->

        <div class="admin-header-left">

            <button
                type="button"

            </button>

            <a

            >

        </div>

            </a>

    <!-- =====================================================
         ADMIN LAYOUT
         ===================================================== -->

    <div class="admin-layout">


        <!-- SIDEBAR -->

        <aside
            class="admin-sidebar"
            id="adminSidebar"
        >

            <div class="admin-sidebar-title">
                Yönetim Paneli
            </div>

            <nav class="admin-nav">

                <a href="admin.html">
                    <span>📊</span>
                    Dashboard
                </a>

                <a
                    href="haber.html"
                    class="active"
                >
                    <span>📰</span>
                    Haberler
                </a>

                <a href="yeni-haber.html">
                    <span>✏️</span>
                    Yeni Haber
                </a>

                <a href="taslaklar.html">
                    <span>📝</span>
                    Taslaklar
                </a>

                <a href="index.html">
                    <span>🌐</span>
                    Siteye Git
                </a>

            </nav>

        </aside>


        <!-- =================================================
             MAIN
             ================================================= -->

        <main class="admin-main haber-yonetim">

            <!-- PAGE HEADER -->

            <div class="admin-page-header">

                <div>

                    <h1>
                        Haber Yönetimi
                    </h1>

                    <p>
                        Yayındaki haberleri yönetin.
                    </p>

                </div>

                <a
                    href="yeni-haber.html"

                >
                    + Yeni Haber
                </a>

            </div>


            <!-- =================================================
                 İSTATİSTİKLER
                 ================================================= -->

            <div class="haber-istatistik-grid">

                <div class="haber-istatistik">

                    <div class="haber-istatistik-label">

                    </div>

                <div class="haber-istatistik">

                    <div

                <div class="haber-istatistik">

            <!-- =================================================

                    <option value="">

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const list =
                    document.getElementById(
                        "haberListesi"
                    );

                const searchInput =
                    document.getElementById(
                        "haberArama"
                    );

                const categoryFilter =
                    document.getElementById(
                        "kategoriFiltre"
                    );

                const statusFilter =
                    document.getElementById(
                        "durumFiltre"
                    );

                const modal =
                    document.getElementById(
                        "silmeModal"
                    );

                const cancelDelete =
                    document.getElementById(
                        "iptalSil"
                    );

                const confirmDelete =
                    document.getElementById(
                        "onaylaSil"
                    );

                let deleteId = null;


                /* =================================================
                   LOCAL STORAGE
                   ================================================= */

                function getNews() {

                    return JSON.parse(
                        localStorage.getItem(
                            "akcaabat_haberler"
                        ) || "[]"
                    );

                }


                function saveNews(news) {

                    localStorage.setItem(
                        "akcaabat_haberler",
                        JSON.stringify(news)
                    );

                }


                /* =================================================
                   ESCAPE
                   ================================================= */

                function escapeHtml(value) {

                    if (
                        value === null ||
                        value === undefined
                    ) {
                        return "";
                    }

                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                /* =================================================
                   GÖRSEL
                   ================================================= */

                const fallbackImage =
                    "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80";


                function getImage(news) {

                    if (
                        news.image &&
                        typeof news.image ===
                            "string" &&
                        news.image.trim() !== ""
                    ) {

                        return news.image;

                    }

                    return fallbackImage;

                }


                /* =================================================
                   TARİH
                   ================================================= */

                function getDate(news) {

                    return (
                        news.publishedAt ||
                        news.createdAt ||
                        news.date ||
                        ""
                    );

                }


                function formatDate(value) {

                    if (!value) {
                        return "Tarih yok";
                    }

                    const date =
                        new Date(value);

                    if (
                        isNaN(
                            date.getTime()
                        )
                    ) {
                        return value;
                    }

                    return date.toLocaleDateString(
                        "tr-TR",
                        {
                            day: "2-digit",
                            month: "2-digit",
                            year: "numeric"
                        }
                    );

                }


                function formatDateTime(value) {

                    if (!value) {
                        return "Tarih yok";
                    }

                    const date =
                        new Date(value);

                    if (
                        isNaN(
                            date.getTime()
                        )
                    ) {
                        return value;
                    }

                    return date.toLocaleString(
                        "tr-TR",
                        {
                            day: "2-digit",
                            month: "2-digit",
                            year: "numeric",
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

                }


                /* =================================================
                   İSTATİSTİKLER
                   ================================================= */

                function updateStats(news) {

                    const total =
                        news.length;

                    const breaking =
                        news.filter(
                            function (item) {
                                return item.breaking === true;
                            }
                        ).length;

                    const today =
                        new Date();

                    const todayCount =
                        news.filter(
                            function (item) {

                                const value =
                                    getDate(item);

                                if (!value) {
                                    return false;
                                }

                                const date =
                                    new Date(value);

                                return (
                                    date.getDate() ===
                                        today.getDate() &&
                                    date.getMonth() ===
                                        today.getMonth() &&
                                    date.getFullYear() ===
                                        today.getFullYear()
                                );

                            }
                        ).length;


                    const views =
                        news.reduce(
                            function (
                                totalViews,
                                item
                            ) {

                                return (
                                    totalViews +
                                    Number(
                                        item.views || 0
                                    )
                                );

                            },
                            0
                        );


                    document.getElementById(
                        "toplamHaber"
                    ).textContent =
                        total;


                    document.getElementById(
                        "sonDakikaHaber"
                    ).textContent =
                        breaking;


                    document.getElementById(
                        "bugunkuHaber"
                    ).textContent =
                        todayCount;


                    document.getElementById(
                        "toplamGoruntulenme"
                    ).textContent =
                        views.toLocaleString(
                            "tr-TR"
                        );

                }


                /* =================================================
                   HABER KARTI
                   ================================================= */

                function createCard(news) {

                    const title =
                        news.title ||
                        news.baslik ||
                        "Başlıksız Haber";

                    const summary =
                        news.summary ||
                        news.ozet ||
                        "";

                    const category =
                        news.category ||
                        news.kategori ||
                        "Genel";

                    const date =
                        getDate(news);


                    return `

                        <article
                            class="haber-yonetim-card"
                        >

                            <div
                                class="haber-yonetim-gorsel"
                            >

                                <img
                                    src="${escapeHtml(
                                        getImage(news)
                                    )}"
                                    alt="${escapeHtml(
                                        title
                                    )}"
                                    onerror="
                                        this.src='${fallbackImage}'
                                    "
                                >

                            </div>


                            <div
                                class="haber-yonetim-bilgi"
                            >

                                <div
                                    class="haber-yonetim-meta"
                                >

                                    <span
                                        class="haber-etiket"
                                    >
                                        ${escapeHtml(
                                            category
                                        )}
                                    </span>

                                    ${
                                        news.breaking
                                            ? `
                                                <span
                                                    class="
                                                        haber-etiket
                                                        son-dakika
                                                    "
                                                >
                                                    ● SON DAKİKA
                                                </span>
                                              `
                                            : ""
                                    }

                                </div>


                                <h2
                                    class="
                                        haber-yonetim-baslik
                                    "
                                >
                                    ${escapeHtml(
                                        title
                                    )}
                                </h2>


                                ${
                                    summary
                                        ? `
                                            <p
                                                class="
                                                    haber-yonetim-ozet
                                                "
                                            >
                                                ${escapeHtml(
                                                    summary
                                                )}
                                            </p>
                                          `
                                        : ""
                                }


                                <div
                                    class="
                                        haber-yonetim-tarih
                                    "
                                >
                                    📅 ${escapeHtml(
                                        formatDateTime(
                                            date
                                        )
                                    )}
                                    &nbsp; • &nbsp;
                                    👁️ ${Number(
                                        news.views || 0
                                    ).toLocaleString(
                                        "tr-TR"
                                    )}
                                </div>

                            </div>


                            <div
                                class="
                                    haber-yonetim-actions
                                "
                            >

                                <a
                                    class="
                                        haber-action-btn
                                        haber-action-view
                                    "
                                    href="
                                        haber-detay.html?id=${encodeURIComponent(
                                            news.id
                                        )}
                                    "
                                    target="_blank"
                                >
                                    Görüntüle
                                </a>


                                <a
                                    class="
                                        haber-action-btn
                                        haber-action-edit
                                    "
                                    href="
                                        yeni-haber.html?edit=${encodeURIComponent(
                                            news.id
                                        )}
                                    "
                                >
                                    Düzenle
                                </a>


                                <button
                                    type="button"
                                    class="
                                        haber-action-btn
                                        haber-action-delete
                                    "
                                    data-delete-id="${escapeHtml(
                                        news.id
                                    )}"
                                >
                                    Sil
                                </button>

                            </div>

                        </article>

                    `;

                }


                /* =================================================
                   LİSTELE
                   ================================================= */

                function renderNews() {

                    const news =
                        getNews();

                    updateStats(
                        news
                    );


                    const search =
                        searchInput.value
                            .trim()
                            .toLocaleLowerCase(
                                "tr-TR"
                            );


                    const category =
                        categoryFilter.value;


                    const status =
                        statusFilter.value;


                    let filtered =
                        news.filter(
                            function (item) {

                                const title =
                                    (
                                        item.title ||
                                        item.baslik ||
                                        ""
                                    )
                                    .toLocaleLowerCase(
                                        "tr-TR"
                                    );


                                const summary =
                                    (
                                        item.summary ||
                                        item.ozet ||
                                        ""
                                    )
                                    .toLocaleLowerCase(
                                        "tr-TR"
                                    );


                                const itemCategory =
                                    item.category ||
                                    item.kategori ||
                                    "";


                                const matchesSearch =
                                    !search ||
                                    title.includes(
                                        search
                                    ) ||
                                    summary.includes(
                                        search
                                    );


                                const matchesCategory =
                                    !category ||
                                    itemCategory ===
                                        category;


                                let matchesStatus =
                                    true;


                                if (
                                    status ===
                                    "breaking"
                                ) {

                                    matchesStatus =
                                        item.breaking ===
                                        true;

                                }


                                if (
                                    status ===
                                    "normal"
                                ) {

                                    matchesStatus =
                                        item.breaking !==
                                        true;

                                }


                                return (
                                    matchesSearch &&
                                    matchesCategory &&
                                    matchesStatus
                                );

                            }
                        );


                    /*
                     * En yeni haber üstte
                     */

                    filtered.sort(
                        function (a, b) {

                            const dateA =
                                new Date(
                                    getDate(a) ||
                                    0
                                );

                            const dateB =
                                new Date(
                                    getDate(b) ||
                                    0
                                );

                            return (
                                dateB - dateA
                            );

                        }
                    );


                    if (
                        filtered.length === 0
                    ) {

                        list.innerHTML = `

                            <div class="haber-bos">

                                <h2>
                                    Haber bulunamadı
                                </h2>

                                <p>
                                    Arama veya filtre
                                    kriterlerinize uygun
                                    yayınlanmış haber yok.
                                </p>

                            </div>

                        `;

                        return;

                    }


                    list.innerHTML =
                        filtered
                            .map(
                                createCard
                            )
                            .join("");


                    /*
                     * Sil butonları
                     */

                    document
                        .querySelectorAll(
                            "[data-delete-id]"
                        )
                        .forEach(
                            function (button) {

                                button.addEventListener(
                                    "click",
                                    function () {

                                        deleteId =
                                            this.dataset.deleteId;

                                        modal.classList.add(
                                            "active"
                                        );

                                    }
                                );

                            }
                        );

                }


                /* =================================================
                   ARAMA
                   ================================================= */

                searchInput.addEventListener(
                    "input",
                    renderNews
                );


                categoryFilter.addEventListener(
                    "change",
                    renderNews
                );


                statusFilter.addEventListener(
                    "change",
                    renderNews
                );


                /* =================================================
                   SİLME MODALI
                   ================================================= */

                cancelDelete.addEventListener(
                    "click",
                    function () {

                        deleteId =
                            null;

                        modal.classList.remove(
                            "active"
                        );

                    }
                );


                confirmDelete.addEventListener(
                    "click",
                    function () {

                        if (!deleteId) {
                            return;
                        }


                        const news =
                            getNews();


                        const updated =
                            news.filter(
                                function (item) {

                                    return String(
                                        item.id
                                    ) !==
                                    String(
                                        deleteId
                                    );

                                }
                            );


                        saveNews(
                            updated
                        );


                        deleteId =
                            null;


                        modal.classList.remove(
                            "active"
                        );


                        renderNews();

                    }
                );


                /*
                 * Modal dışına tıklama
                 */

                modal.addEventListener(
                    "click",
                    function (event) {

                        if (
                            event.target ===
                            modal
                        ) {

                            modal.classList.remove(
                                "active"
                            );

                            deleteId =
                                null;

                        }

                    }
                );


                /* =================================================
                   ESC İLE MODAL KAPAT
                   ================================================= */

                document.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            modal.classList.remove(
                                "active"
                            );

                            deleteId =
                                null;

                        }

                    }
                );


                /* =================================================
                   ADMIN MOBİL MENÜ
                   ================================================= */

                const adminMenuBtn =
                    document.getElementById(
                        "adminMenuBtn"
                    );

                const adminSidebar =
                    document.getElementById(
                        "adminSidebar"
                    );


                if (
                    adminMenuBtn &&
                    adminSidebar
                ) {

                    adminMenuBtn.addEventListener(
                        "click",
                        function () {

                            adminSidebar.classList.toggle(
                                "open"
                            );

                        }
                    );

                }


                /* =================================================
                   URL'DEN ARAMA
                   ================================================= */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const urlSearch =
                    params.get("search");


                if (urlSearch) {

                    searchInput.value =
                        urlSearch;

                }


                /* =================================================
                   BAŞLAT
                   ================================================= */

                renderNews();

            });

    </script>

</body>
</html>
