    <style>
        .news-page {
            max-width: 1240px;
            margin: 0 auto;
            padding: 30px 20px 70px;
        }

        .news-page-header {
            margin-bottom: 28px;
        }

        .news-page-header h1 {
            margin: 0 0 9px;
            color: #171717;
            font-size: clamp(30px, 4vw, 44px);
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -.8px;
        }

        .news-page-header p {
            margin: 0;
            color: #777;
            font-size: 16px;
            line-height: 1.6;
        }

        .news-toolbar {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 220px 180px;
            gap: 12px;
            margin-bottom: 25px;
            padding: 16px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 14px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .04);
        }

        .news-search,
        .news-filter,
        .news-sort {
            width: 100%;
            box-sizing: border-box;
            min-height: 44px;
            border: 1px solid #ddd;
            border-radius: 9px;
            padding: 0 13px;
            background: #fff;
            color: #333;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .news-search:focus,
        .news-filter:focus,
        .news-sort:focus {
            border-color: #174c92;
            box-shadow: 0 0 0 3px rgba(23, 76, 146, .09);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .news-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            background: #fff;
            border: 1px solid #e9e9e9;
            border-radius: 15px;
            box-shadow: 0 7px 25px rgba(0, 0, 0, .05);
            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .09);
        }

        .news-card-image-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #f1f1f1;
        }

        .news-card-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .3s ease;
        }

        .news-card:hover .news-card-image {
            transform: scale(1.035);
        }

        .news-card-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(
                    135deg,
                    #123d75,
                    #1e5ca8
                );
            color: #fff;
            font-size: 16px;
            font-weight: 800;
        }

        .news-breaking {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 2;
            padding: 6px 9px;
            border-radius: 6px;
            background: #c8102e;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .3px;
        }

        .news-card-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 18px;
        }

        .news-card-category {
            margin-bottom: 8px;
            color: #174c92;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .3px;
        }

        .news-card-title {
            margin: 0 0 9px;
            color: #202020;
            font-size: 20px;
            line-height: 1.3;
            font-weight: 800;
        }

        .news-card-title a {
            color: inherit;
            text-decoration: none;
        }

        .news-card-title a:hover {
            color: #174c92;
        }

        .news-card-summary {
            display: -webkit-box;
            overflow: hidden;
            margin: 0;
            color: #6d6d6d;
            font-size: 14px;
            line-height: 1.6;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .news-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: auto;
            padding-top: 16px;
        }

        .news-card-date {
            color: #999;
            font-size: 11px;
        }

        .news-card-read {
            color: #174c92;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
        }

        .news-card-read:hover {
            text-decoration: underline;
        }

        .news-empty,
        .news-loading,
        .news-error {
            grid-column: 1 / -1;
            padding: 65px 20px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 15px;
            text-align: center;
        }

        .news-empty h2,
        .news-loading h2,
        .news-error h2 {
            margin: 0 0 10px;
            color: #222;
            font-size: 22px;
        }

        .news-empty p,
        .news-loading p,
        .news-error p {
            margin: 0;
            color: #777;
            line-height: 1.6;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 32px;
        }

        .pagination button {
            min-width: 38px;
            height: 38px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #444;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
        }

        .pagination button:hover {
            border-color: #174c92;
            color: #174c92;
        }

        .pagination button.active {
            border-color: #174c92;
            background: #174c92;
            color: #fff;
        }

        .pagination button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .news-result-info {
            margin-bottom: 14px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 950px) {
            .news-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .news-toolbar {
                grid-template-columns: 1fr 1fr;
            }

            .news-search {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 620px) {
            .news-page {
                padding: 22px 12px 50px;
            }

            .news-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .news-toolbar {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            .news-search {
                grid-column: auto;
            }

            .news-page-header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div id="site-header"></div>

    <main class="news-page">

        <header class="news-page-header">
            <h1>Haberler</h1>

            <p>
                Akçaabat, Trabzon ve Türkiye'den en güncel haberleri
                takip edin.
            </p>
        </header>

        <section
            class="news-toolbar"
            aria-label="Haber filtreleri"
        >

            <input
                id="news-search"
                class="news-search"
                type="search"
                placeholder="Haber ara..."
                autocomplete="off"
            >

            <select
                id="news-category"
                class="news-filter"
            >
                <option value="">Tüm Kategoriler</option>
            </select>

            <select
                id="news-sort"
                class="news-sort"
            >
                <option value="newest">En Yeni</option>
                <option value="oldest">En Eski</option>
                <option value="popular">En Çok Okunan</option>
            </select>

        </section>

        <div
            id="news-result-info"
            class="news-result-info"
        >
            Haberler yükleniyor...
        </div>

        <section
            id="news-grid"
            class="news-grid"
            aria-live="polite"
        >

            <div class="news-loading">
                <h2>Haberler yükleniyor...</h2>
                <p>
                    Güncel haberler veritabanından getiriliyor.
                </p>
            </div>

        </section>

        <nav
            id="pagination"
            class="pagination"
            aria-label="Haber sayfaları"
        ></nav>

    </main>

    <div id="site-footer"></div>

    <script>
        (function () {
            "use strict";

            const PAGE_SIZE = 9;

            let allNews = [];
            let filteredNews = [];
            let currentPage = 1;

            let supabaseClient = null;

            const DEFAULT_IMAGE =
                "https://akcaabathaber.com.tr/assets/default-news.jpg";

            function getSupabase() {
                if (
                    window.AkcaabatHaber &&
                    typeof window.AkcaabatHaber
                        .getSupabaseClient ===
                        "function"
                ) {
                    return window.AkcaabatHaber
                        .getSupabaseClient();
                }

                if (
                    window.supabase &&
                    window.AKCAABAT_SUPABASE
                ) {
                    if (!supabaseClient) {
                        supabaseClient =
                            window.supabase.createClient(
                                window
                                    .AKCAABAT_SUPABASE
                                    .url,
                                window
                                    .AKCAABAT_SUPABASE
                                    .key
                            );
                    }

                    return supabaseClient;
                }

                return null;
            }

            function escapeHtml(value) {
                if (
                    value === null ||
                    value === undefined
                ) {
                    return "";
                }

                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function formatDate(value) {
                if (!value) {
                    return "";
                }

                const date =
                    new Date(value);

                if (
                    Number.isNaN(
                        date.getTime()
                    )
                ) {
                    return "";
                }

                return new Intl.DateTimeFormat(
                    "tr-TR",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }
                ).format(date);
            }

            function normalizeNews(row) {
                const category =
                    Array.isArray(row.category)
                        ? row.category[0]
                        : row.category;

                return {
                    id: row.id,
                    title:
                        row.title || "",
                    slug:
                        row.slug || "",
                    summary:
                        row.summary || "",
                    content:
                        row.content || "",
                    category_id:
                        row.category_id || null,
                    category_name:
                        category &&
                        category.name
                            ? category.name
                            : "Genel",
                    category_slug:
                        category &&
                        category.slug
                            ? category.slug
                            : "",
                    image_url:
                        row.image_url || "",
                    status:
                        row.status || "published",
                    is_breaking:
                        Boolean(
                            row.is_breaking
                        ),
                    views:
                        Number(
                            row.views || 0
                        ),
                    published_at:
                        row.published_at ||
                        row.created_at ||
                        null,
                    created_at:
                        row.created_at ||
                        null,
                    updated_at:
                        row.updated_at ||
                        null
                };
            }

            async function loadCategories() {
                const select =
                    document.getElementById(
                        "news-category"
                    );

                const client =
                    getSupabase();

                if (!client || !select) {
                    return;
                }

                const result =
                    await client
                        .from("categories")
                        .select(
                            "id,name,slug"
                        )
                        .eq(
                            "is_active",
                            true
                        )
                        .order(
                            "sort_order",
                            {
                                ascending: true
                            }
                        );

                if (result.error) {
                    console.warn(
                        "Kategori yükleme hatası:",
                        result.error
                    );

                    return;
                }

                (result.data || [])
                    .forEach(function (
                        category
                    ) {
                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            category.slug;

                        option.textContent =
                            category.name;

                        select.appendChild(
                            option
                        );
                    });
            }

            async function loadNews() {
                const client =
                    getSupabase();

                if (!client) {
                    showError(
                        "Supabase bağlantısı kurulamadı."
                    );

                    return;
                }

                const result =
                    await client
                        .from("news")
                        .select(
                            `
                            id,
                            title,
                            slug,
                            summary,
                            content,
                            category_id,
                            image_url,
                            status,
                            is_breaking,
                            views,
                            published_at,
                            created_at,
                            updated_at,
                            category:categories(
                                id,
                                name,
                                slug
                            )
                            `
                        )
                        .eq(
                            "status",
                            "published"
                        )
                        .order(
                            "published_at",
                            {
                                ascending: false
                            }
                        );

                if (result.error) {
                    console.error(
                        "Haberler yüklenemedi:",
                        result.error
                    );

                    showError(
                        "Haberler yüklenirken bir hata oluştu."
                    );

                    return;
                }

                allNews =
                    (result.data || [])
                        .map(
                            normalizeNews
                        );

                applyFilters();
            }

            function applyFilters() {
                const search =
                    document
                        .getElementById(
                            "news-search"
                        )
                        .value
                        .trim()
                        .toLocaleLowerCase(
                            "tr-TR"
                        );

                const category =
                    document
                        .getElementById(
                            "news-category"
                        )
                        .value;

                const sort =
                    document
                        .getElementById(
                            "news-sort"
                        )
                        .value;

                filteredNews =
                    allNews.filter(
                        function (news) {
                            const searchable =
                                (
                                    news.title +
                                    " " +
                                    news.summary +
                                    " " +
                                    news.content +
                                    " " +
                                    news.category_name
                                ).toLocaleLowerCase(
                                    "tr-TR"
                                );

                            const matchesSearch =
                                !search ||
                                searchable.includes(
                                    search
                                );

                            const matchesCategory =
                                !category ||
                                news.category_slug ===
                                    category;

                            return (
                                matchesSearch &&
                                matchesCategory
                            );
                        }
                    );

                if (sort === "oldest") {
                    filteredNews.sort(
                        function (a, b) {
                            return (
                                new Date(
                                    a.published_at ||
                                    a.created_at
                                ) -
                                new Date(
                                    b.published_at ||
                                    b.created_at
                                )
                            );
                        }
                    );
                }

                if (sort === "popular") {
                    filteredNews.sort(
                        function (a, b) {
                            return (
                                Number(
                                    b.views || 0
                                ) -
                                Number(
                                    a.views || 0
                                )
                            );
                        }
                    );
                }

                if (sort === "newest") {
                    filteredNews.sort(
                        function (a, b) {
                            return (
                                new Date(
                                    b.published_at ||
                                    b.created_at
                                ) -
                                new Date(
                                    a.published_at ||
                                    a.created_at
                                )
                            );
                        }
                    );
                }

                currentPage = 1;

                renderNews();
                renderPagination();
            }

            function renderNews() {
                const grid =
                    document.getElementById(
                        "news-grid"
                    );

                const resultInfo =
                    document.getElementById(
                        "news-result-info"
                    );

                if (!grid) {
                    return;
                }

                const total =
                    filteredNews.length;

                if (resultInfo) {
                    resultInfo.textContent =
                        total === 0
                            ? "Sonuç bulunamadı."
                            : total +
                              " haber bulundu.";
                }

                if (!total) {
                    grid.innerHTML = `
                        <div class="news-empty">
                            <h2>Haber bulunamadı</h2>
                            <p>
                                Arama veya filtre kriterlerinize
                                uygun yayınlanmış haber bulunmuyor.
                            </p>
                        </div>
                    `;

                    return;
                }

                const start =
                    (currentPage - 1) *
                    PAGE_SIZE;

                const end =
                    start +
                    PAGE_SIZE;

                const pageItems =
                    filteredNews.slice(
                        start,
                        end
                    );

                grid.innerHTML =
                    pageItems
                        .map(
                            renderNewsCard
                        )
                        .join("");
            }

            function renderNewsCard(news) {
                const image =
                    news.image_url ||
                    "";

                const imageHtml =
                    image
                        ? `
                            <img
                                class="news-card-image"
                                src="${escapeHtml(
                                    image
                                )}"
                                alt="${escapeHtml(
                                    news.title
                                )}"
                                loading="lazy"
                                onerror="this.style.display='none';"
                            >
                        `
                        : `
                            <div class="news-card-placeholder">
                                Akçaabat Haber
                            </div>
                        `;

                const breaking =
                    news.is_breaking
                        ? `
                            <span class="news-breaking">
                                SON DAKİKA
                            </span>
                        `
                        : "";

                return `
                    <article class="news-card">

                        <div class="news-card-image-wrap">
                            ${imageHtml}
                            ${breaking}
                        </div>

                        <div class="news-card-body">

                            <div class="news-card-category">
                                ${escapeHtml(
                                    news.category_name
                                )}
                            </div>

                            <h2 class="news-card-title">
                                <a
                                    href="haber-detay.html?slug=${encodeURIComponent(
                                        news.slug
                                    )}"
                                >
                                    ${escapeHtml(
                                        news.title
                                    )}
                                </a>
                            </h2>

                            <p class="news-card-summary">
                                ${escapeHtml(
                                    news.summary
                                )}
                            </p>

                            <div class="news-card-footer">

                                <span class="news-card-date">
                                    ${formatDate(
                                        news.published_at ||
                                        news.created_at
                                    )}
                                </span>

                                <a
                                    class="news-card-read"
                                    href="haber-detay.html?slug=${encodeURIComponent(
                                        news.slug
                                    )}"
                                >
                                    Haberi Oku →
                                </a>

                            </div>

                        </div>

                    </article>
                `;
            }

            function renderPagination() {
                const container =
                    document.getElementById(
                        "pagination"
                    );

                if (!container) {
                    return;
                }

                const totalPages =
                    Math.ceil(
                        filteredNews.length /
                        PAGE_SIZE
                    );

                if (totalPages <= 1) {
                    container.innerHTML =
                        "";

                    return;
                }

                let html = "";

                html += `
                    <button
                        type="button"
                        data-page="${
                            currentPage - 1
                        }"
                        ${
                            currentPage === 1
                                ? "disabled"
                                : ""
                        }
                    >
                        ‹
                    </button>
                `;

                const maxButtons = 7;

                let startPage =
                    Math.max(
                        1,
                        currentPage -
                            Math.floor(
                                maxButtons /
                                2
                            )
                    );

                let endPage =
                    Math.min(
                        totalPages,
                        startPage +
                            maxButtons -
                            1
                    );

                if (
                    endPage -
                        startPage +
                        1 <
                    maxButtons
                ) {
                    startPage =
                        Math.max(
                            1,
                            endPage -
                                maxButtons +
                                1
                        );
                }

                if (startPage > 1) {
                    html += `
                        <button
                            type="button"
                            data-page="1"
                        >
                            1
                        </button>
                    `;

                    if (startPage > 2) {
                        html += `
                            <span>…</span>
                        `;
                    }
                }

                for (
                    let page = startPage;
                    page <= endPage;
                    page++
                ) {
                    html += `
                        <button
                            type="button"
                            data-page="${page}"
                            class="${
                                page === currentPage
                                    ? "active"
                                    : ""
                            }"
                        >
                            ${page}
                        </button>
                    `;
                }

                if (
                    endPage <
                    totalPages
                ) {
                    if (
                        endPage <
                        totalPages - 1
                    ) {
                        html += `
                            <span>…</span>
                        `;
                    }

                    html += `
                        <button
                            type="button"
                            data-page="${totalPages}"
                        >
                            ${totalPages}
                        </button>
                    `;
                }

                html += `
                    <button
                        type="button"
                        data-page="${
                            currentPage + 1
                        }"
                        ${
                            currentPage ===
                            totalPages
                                ? "disabled"
                                : ""
                        }
                    >
                        ›
                    </button>
                `;

                container.innerHTML =
                    html;

                container
                    .querySelectorAll(
                        "button[data-page]"
                    )
                    .forEach(
                        function (
                            button
                        ) {
                            button.addEventListener(
                                "click",
                                function () {
                                    const page =
                                        Number(
                                            button.dataset
                                                .page
                                        );

                                    if (
                                        !page ||
                                        page <
                                            1 ||
                                        page >
                                            totalPages
                                    ) {
                                        return;
                                    }

                                    currentPage =
                                        page;

                                    renderNews();
                                    renderPagination();

                                    window.scrollTo({
                                        top: 0,
                                        behavior:
                                            "smooth"
                                    });
                                }
                            );
                        }
                    );
            }

            function showError(message) {
                const grid =
                    document.getElementById(
                        "news-grid"
                    );

                const resultInfo =
                    document.getElementById(
                        "news-result-info"
                    );

                if (resultInfo) {
                    resultInfo.textContent =
                        "";
                }

                if (!grid) {
                    return;
                }

                grid.innerHTML = `
                    <div class="news-error">
                        <h2>Bir sorun oluştu</h2>
                        <p>
                            ${escapeHtml(
                                message
                            )}
                        </p>
                    </div>
                `;
            }

            function initialize() {
                const search =
                    document.getElementById(
                        "news-search"
                    );

                const category =
                    document.getElementById(
                        "news-category"
                    );

                const sort =
                    document.getElementById(
                        "news-sort"
                    );

                if (search) {
                    search.addEventListener(
                        "input",
                        function () {
                            applyFilters();
                        }
                    );
                }

                if (category) {
                    category.addEventListener(
                        "change",
                        function () {
                            applyFilters();
                        }
                    );
                }

                if (sort) {
                    sort.addEventListener(
                        "change",
                        function () {
                            applyFilters();
                        }
                    );
                }

                Promise.all([
                    loadCategories(),
                    loadNews()
                ]);
            }

            if (
                document.readyState ===
                "loading"
            ) {
                document.addEventListener(
                    "DOMContentLoaded",
                    initialize
                );
            } else {
                initialize();
            }

        })();
    </script>

</body>
</html>
