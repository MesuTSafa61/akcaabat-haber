<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#b91c1c">

    <title>Sayfa Bulunamadı | Akçaabat Haber</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #b91c1c;
            --primary-dark: #991b1b;
            --dark: #111827;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f8fafc;
            --white: #ffffff;
        }

        body {
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(185, 28, 28, 0.08),
                    transparent 38%
                ),
                var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .topbar {
            height: 70px;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: relative;
            z-index: 2;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 900;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #ef4444
                );
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            box-shadow:
                0 7px 18px rgba(185,28,28,0.18);
        }

        .logo-text {
            color: var(--dark);
            font-size: 17px;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            color: var(--primary);
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 40px;
            padding: 8px 14px;
            border-radius: 9px;
            background: #f3f4f6;
            color: #374151;
            font-size: 13px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .home-link:hover {
            background: #e5e7eb;
            color: var(--primary);
        }

        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px 70px;
        }

        .error-card {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .error-number {
            font-size: clamp(100px, 22vw, 210px);
            line-height: 0.82;
            font-weight: 950;
            letter-spacing: -12px;
            color: transparent;
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #ef4444
                );
            -webkit-background-clip: text;
            background-clip: text;
            user-select: none;
        }

        .error-icon {
            width: 76px;
            height: 76px;
            border-radius: 22px;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 24px auto 22px;
            font-size: 32px;
        }

        h1 {
            color: var(--dark);
            font-size: clamp(25px, 5vw, 38px);
            line-height: 1.15;
            font-weight: 850;
            letter-spacing: -1px;
        }

        .description {
            max-width: 540px;
            margin: 14px auto 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 11px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        .btn {
            min-height: 46px;
            padding: 11px 19px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            color: #fff;
            background: var(--primary);
            box-shadow:
                0 8px 20px rgba(185,28,28,0.18);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow:
                0 11px 25px rgba(185,28,28,0.25);
        }

        .btn-secondary {
            color: #374151;
            background: #fff;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f9fafb;
        }

        .quick-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 34px;
        }

        .quick-link {
            color: #6b7280;
            font-size: 12px;
            font-weight: 650;
            padding: 7px 10px;
            border-radius: 7px;
            transition: 0.2s ease;
        }

        .quick-link:hover {
            color: var(--primary);
            background: #fff;
        }

        .footer {
            border-top: 1px solid var(--border);
            background: #fff;
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 11px;
        }

        .footer strong {
            color: #6b7280;
        }

        @media (max-width: 600px) {
            .topbar {
                height: 64px;
                padding: 0 18px;
            }

            .logo-mark {
                width: 36px;
                height: 36px;
            }

            .logo-text {
                font-size: 15px;
            }

            .home-link span:last-child {
                display: none;
            }

            .home-link {
                width: 40px;
                height: 40px;
                padding: 0;
                justify-content: center;
            }

            .page {
                padding:
                    35px
                    18px
                    50px;
            }

            .error-number {
                letter-spacing: -7px;
            }

            .error-icon {
                width: 65px;
                height: 65px;
                border-radius: 18px;
                font-size: 27px;
                margin-top: 20px;
            }

            .description {
                font-size: 14px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
  <link rel="stylesheet" href="portal-shell.css">
</head>

<body>

    <header class="topbar">

        <a href="index.html" class="logo" aria-label="Akçaabat Haber ana sayfa">
            <div class="logo-mark">AH</div>

            <div class="logo-text">
                Akçaabat <span>Haber</span>
            </div>
        </a>

        <a href="index.html" class="home-link">
            <span>⌂</span>
            <span>Ana Sayfa</span>
        </a>

    </header>

    <main class="page">

        <section class="error-card" aria-labelledby="error-title">

            <div class="error-number" aria-hidden="true">
                404
            </div>

            <div class="error-icon" aria-hidden="true">
                🔎
            </div>

            <h1 id="error-title">
                Aradığınız sayfa bulunamadı
            </h1>

            <p class="description">
                Aradığınız sayfa taşınmış, silinmiş veya artık
                kullanılmıyor olabilir. Ana sayfaya dönerek
                güncel haberleri keşfedebilirsiniz.
            </p>

            <div class="actions">

                <a href="index.html" class="btn btn-primary">
                    🏠 Ana Sayfaya Dön
                </a>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="history.back();"
                >
                    ← Önceki Sayfa
                </button>

            </div>

            <nav class="quick-links" aria-label="Hızlı bağlantılar">

                <a href="haberler.html" class="quick-link">
                    Son Haberler
                </a>

                <a href="haber-detay.html" class="quick-link">
                    Haberler
                </a>

                <a href="index.html#son-haberler" class="quick-link">
                    Son Dakika
                </a>

                <a href="index.html#kategoriler" class="quick-link">
                    Kategoriler
                </a>

            </nav>

        </section>

    </main>

    <footer class="footer">
        © <span id="year"></span>
        <strong>Akçaabat Haber</strong>.
        Tüm hakları saklıdır.
    </footer>

    <script>
        (function () {
            const year = document.getElementById("year");

            if (year) {
                year.textContent = new Date().getFullYear();
            }
        })();
    </script>

  <script src="portal-shell.js" defer></script>
</body>
</html>
