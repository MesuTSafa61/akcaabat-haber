<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taslaklar | Akçaabat Haber</title>

    <meta
        name="description"
        content="Akçaabat Haber yönetim paneli taslak haber yönetimi."
    >

    <link rel="stylesheet" href="style.css">

    <style>
        .taslak-sayfa {
            width: 100%;
        }

        .taslak-istatistik-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .taslak-istatistik {
            padding: 20px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .taslak-istatistik-label {
            margin-bottom: 8px;
            color: #777;
            font-size: 13px;
        }

        .taslak-istatistik-value {
            color: #222;
            font-size: 28px;
            font-weight: 800;
        }

        .taslak-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .taslak-toolbar input,
        .taslak-toolbar select {
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            background: #fff;
        }

        .taslak-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .taslak-toolbar input:focus,
        .taslak-toolbar select:focus {
            border-color: #b40018;
        }

        .taslak-liste {
            display: grid;
            gap: 15px;
        }

        .taslak-card {
            display: grid;
            grid-template-columns: 180px minmax(0, 1fr) auto;
            gap: 20px;
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .taslak-gorsel {
            width: 180px;
            height: 120px;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
        }

        .taslak-gorsel img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .taslak-bilgi {
            min-width: 0;
        }

        .taslak-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 7px;
        }

        .taslak-etiket {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 5px;
            background: #f0f0f0;
            color: #555;
            font-size: 11px;
            font-weight: 800;
        }

        .taslak-etiket.son-dakika {
            background: #111;
            color: #fff;
        }

        .taslak-baslik {
            margin: 0 0 8px;
            color: #222;
            font-size: 19px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .taslak-ozet {
            margin: 0 0 9px;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        .taslak-tarih {
            color: #999;
            font-size: 12px;
        }

        .taslak-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 105px;
        }

        .taslak-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 0 12px;
            border: 0;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: .2s ease;
        }

        .taslak-btn:hover {
            transform: translateY(-1px);
        }

        .taslak-duzenle {
            background: #eee;
            color: #222;
        }

        .taslak-duzenle:hover {
            background: #ddd;
        }

        .taslak-yayinla {
            background: #b40018;
            color: #fff;
        }

        .taslak-yayinla:hover {
            background: #930014;
        }

        .taslak-sil {
            background: #222;
            color: #fff;
        }

        .taslak-sil:hover {
            background: #000;
        }

        .taslak-bos {
            padding: 60px 20px;
            border-radius: 12px;
            background: #fff;
            text-align: center;
            color: #777;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .taslak-bos-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .taslak-bos h2 {
            margin: 0 0 10px;
            color: #222;
        }

        .taslak-bos p {
            margin: 0;
            line-height: 1.6;
        }

        .taslak-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .55);
        }

        .taslak-modal.active {
            display: flex;
        }

        .taslak-modal-box {
            width: 100%;
            max-width: 440px;
            padding: 28px;
            border-radius: 14px;
            background: #fff;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
        }

        .taslak-modal-box h2 {
            margin: 0 0 10px;
            color: #222;
        }

        .taslak-modal-box p {
            margin: 0 0 22px;
            color: #777;
            line-height: 1.5;
        }

        .taslak-modal-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .taslak-modal-actions button {
            min-height: 40px;
            padding: 0 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        #taslakIptal {
            background: #eee;
            color: #222;
        }

        #taslakOnayla {
            background: #b40018;
            color: #fff;
        }

        .taslak-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 10000;
            max-width: 360px;
            padding: 13px 17px;
            border-radius: 9px;
            background: #222;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: .25s ease;
        }

        .taslak-toast.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        @media (max-width: 1000px) {
            .taslak-istatistik-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .taslak-card {
                grid-template-columns: 140px minmax(0, 1fr);
            }

            .taslak-gorsel {
                width: 140px;
                height: 100px;
            }

            .taslak-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: flex-end;
            }
        }

        @media (max-width: 650px) {
            .taslak-istatistik-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .taslak-istatistik {
                padding: 15px;
            }

            .taslak-istatistik-value {
                font-size: 23px;
            }

            .taslak-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .taslak-toolbar input,
            .taslak-toolbar select {
                width: 100%;
            }

            .taslak-card {
                grid-template-columns: 1fr;
            }

            .taslak-gorsel {
                width: 100%;
                height: 190px;
            }

            .taslak-actions {
                grid-column: auto;
                flex-direction: row;
            }

            .taslak-btn {
                flex: 1;
            }

            .taslak-modal-box {
                padding: 22px;
            }
        }
    </style>
</head>

    <!-- =====================================================
         SAYFA JAVASCRIPT
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                /* =================================================
                   ELEMENTLER
                   ================================================= */

                const list =
                    document.getElementById(
                        "taslakListesi"
                    );

                const searchInput =
                    document.getElementById(
                        "taslakArama"
                    );

                const categoryFilter =
                    document.getElementById(
                        "taslakKategori"
                    );

                const modal =
                    document.getElementById(
                        "taslakModal"
                    );

                const modalTitle =
                    document.getElementById(
                        "modalTitle"
                    );

                const modalText =
                    document.getElementById(
                        "modalText"
                    );

                const cancelButton =
                    document.getElementById(
                        "taslakIptal"
                    );

                const confirmButton =
                    document.getElementById(
                        "taslakOnayla"
                    );

                const toast =
                    document.getElementById(
                        "taslakToast"
                    );

                const adminMenuBtn =
                    document.getElementById(
                        "adminMenuBtn"
                    );

                const adminSidebar =
                    document.getElementById(
                        "adminSidebar"
                    );


                let actionId = null;
                let actionType = null;
                let toastTimer = null;


                /* =================================================
                   GÜVENLİ JSON
                   ================================================= */

                function safeParse(
                    value,
                    fallback
                ) {

                    try {

                        const parsed =
                            JSON.parse(
                                value
                            );

                        return parsed;

                    } catch (error) {

                        return fallback;

                    }

                }


                /* =================================================
                   STORAGE
                   ================================================= */

                function getDrafts() {

                    const raw =
                        localStorage.getItem(
                            "akcaabat_taslaklar"
                        );

                    const data =
                        safeParse(
                            raw,
                            []
                        );

                    return Array.isArray(
                        data
                    )
                        ? data
                        : [];

                }


                function saveDrafts(
                    drafts
                ) {

                    localStorage.setItem(
                        "akcaabat_taslaklar",
                        JSON.stringify(
                            drafts
                        )
                    );

                }


                function getNews() {

                    const raw =
                        localStorage.getItem(
                            "akcaabat_haberler"
                        );

                    const data =
                        safeParse(
                            raw,
                            []
                        );

                    return Array.isArray(
                        data
                    )
                        ? data
                        : [];

                }


                function saveNews(
                    news
                ) {

                    localStorage.setItem(
                        "akcaabat_haberler",
                        JSON.stringify(
                            news
                        )
                    );

                }


                /* =================================================
                   HTML ESCAPE
                   ================================================= */

                function escapeHtml(
                    value
                ) {

                    if (
                        value === null ||
                        value === undefined
                    ) {
                        return "";
                    }

                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                /* =================================================
                   SLUG
                   ================================================= */

                function slugify(
                    text
                ) {

                    if (
                        window.AkcaabatHaber &&
                        typeof window.AkcaabatHaber.slugify ===
                            "function"
                    ) {

                        return window.AkcaabatHaber.slugify(
                            text
                        );

                    }


                    return String(
                        text || ""
                    )
                        .toLocaleLowerCase(
                            "tr-TR"
                        )
                        .replace(
                            /ğ/g,
                            "g"
                        )
                        .replace(
                            /ü/g,
                            "u"
                        )
                        .replace(
                            /ş/g,
                            "s"
                        )
                        .replace(
                            /ı/g,
                            "i"
                        )
                        .replace(
                            /ö/g,
                            "o"
                        )
                        .replace(
                            /ç/g,
                            "c"
                        )
                        .replace(
                            /[^a-z0-9]+/g,
                            "-"
                        )
                        .replace(
                            /^-+|-+$/g,
                            "");

                }


                function createUniqueSlug(
                    title,
                    news,
                    currentId
                ) {

                    if (
                        window.AkcaabatHaber &&
                        typeof window.AkcaabatHaber.createUniqueSlug ===
                            "function"
                    ) {

                        return window.AkcaabatHaber.createUniqueSlug(
                            title,
                            news,
                            currentId
                        );

                    }


                    const base =
                        slugify(
                            title
                        ) ||
                        "haber";


                    let slug =
                        base;

                    let counter =
                        2;


                    while (
                        news.some(
                            function (
                                item
                            ) {

                                return (
                                    String(
                                        item.id
                                    ) !==
                                    String(
                                        currentId
                                    ) &&
                                    (
                                        item.slug ||
                                        item.seoSlug
                                    ) ===
                                    slug
                                );

                            }
                        )
                    ) {

                        slug =
                            base +
                            "-" +
                            counter;

                        counter++;

                    }


                    return slug;

                }


                /* =================================================
                   GÖRSEL
                   ================================================= */

                const fallbackImage =
                    "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80";


                function getImage(
                    draft
                ) {

                    const image =
                        draft.image ||
                        draft.gorsel ||
                        draft.imageUrl ||
                        draft.gorselUrl ||
                        "";


                    if (
                        typeof image ===
                            "string" &&
                        image.trim() !== ""
                    ) {

                        return image;

                    }


                    return fallbackImage;

                }


                /* =================================================
                   BAŞLIK
                   ================================================= */

                function getTitle(
                    item
                ) {

                    return (
                        item.title ||
                        item.baslik ||
                        "Başlıksız Taslak"
                    );

                }


                /* =================================================
                   ÖZET
                   ================================================= */

                function getSummary(
                    item
                ) {

                    return (
                        item.summary ||
                        item.ozet ||
                        ""
                    );

                }


                /* =================================================
                   KATEGORİ
                   ================================================= */

                function getCategory(
                    item
                ) {

                    return (
                        item.category ||
                        item.kategori ||
                        "Kategori yok"
                    );

                }


                /* =================================================
                   TARİH
                   ================================================= */

                function getDate(
                    item
                ) {

                    return (
                        item.updatedAt ||
                        item.updated_at ||
                        item.createdAt ||
                        item.created_at ||
                        ""
                    );

                }


                function formatDate(
                    value
                ) {

                    if (!value) {

                        return "Tarih yok";

                    }


                    const date =
                        new Date(
                            value
                        );


                    if (
                        isNaN(
                            date.getTime()
                        )
                    ) {

                        return String(
                            value
                        );

                    }


                    return date.toLocaleString(
                        "tr-TR",
                        {
                            day: "2-digit",
                            month: "2-digit",
                            year: "numeric",
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

                }


                /* =================================================
                   TOAST
                   ================================================= */

                function showToast(
                    message
                ) {

                    if (!toast) {
                        return;
                    }


                    clearTimeout(
                        toastTimer
                    );


                    toast.textContent =
                        message;


                    toast.classList.add(
                        "active"
                    );


                    toastTimer =
                        setTimeout(
                            function () {

                                toast.classList.remove(
                                    "active"
                                );

                            },
                            2800
                        );

                }


                /* =================================================
                   İSTATİSTİK
                   ================================================= */

                function updateStats(
                    drafts
                ) {

                    const total =
                        drafts.length;


                    const breaking =
                        drafts.filter(
                            function (
                                item
                            ) {

                                return (
                                    item.breaking ===
                                        true ||
                                    item.breaking ===
                                        "true" ||
                                    item.sonDakika ===
                                        true ||
                                    item.sonDakika ===
                                        "true"
                                );

                            }
                        ).length;


                    const categorized =
                        drafts.filter(
                            function (
                                item
                            ) {

                                const category =
                                    getCategory(
                                        item
                                    );


                                return (
                                    category &&
                                    category !==
                                        "Kategori yok"
                                );

                            }
                        ).length;


                    document.getElementById(
                        "toplamTaslak"
                    ).textContent =
                        total;


                    document.getElementById(
                        "sonDakikaTaslak"
                    ).textContent =
                        breaking;


                    document.getElementById(
                        "kategoriliTaslak"
                    ).textContent =
                        categorized;

                }


                /* =================================================
                   KART
                   ================================================= */

                function createCard(
                    draft
                ) {

                    const title =
                        getTitle(
                            draft
                        );


                    const summary =
                        getSummary(
                            draft
                        );


                    const category =
                        getCategory(
                            draft
                        );


                    const id =
                        draft.id;


                    const isBreaking =
                        draft.breaking ===
                            true ||
                        draft.breaking ===
                            "true" ||
                        draft.sonDakika ===
                            true ||
                        draft.sonDakika ===
                            "true";


                    return `

                        <article
                            class="taslak-card"
                        >

                            <div
                                class="taslak-gorsel"
                            >

                                <img
                                    src="${escapeHtml(
                                        getImage(
                                            draft
                                        )
                                    )}"
                                    alt="${escapeHtml(
                                        title
                                    )}"
                                    loading="lazy"
                                    onerror="
                                        this.onerror=null;
                                        this.src='${fallbackImage}';
                                    "
                                >

                            </div>


                            <div
                                class="taslak-bilgi"
                            >

                                <div
                                    class="taslak-meta"
                                >

                                    <span
                                        class="taslak-etiket"
                                    >
                                        ${escapeHtml(
                                            category
                                        )}
                                    </span>


                                    ${
                                        isBreaking
                                            ? `
                                                <span
                                                    class="
                                                        taslak-etiket
                                                        son-dakika
                                                    "
                                                >
                                                    ● SON DAKİKA
                                                </span>
                                              `
                                            : ""
                                    }

                                </div>


                                <h2
                                    class="taslak-baslik"
                                >
                                    ${escapeHtml(
                                        title
                                    )}
                                </h2>


                                ${
                                    summary
                                        ? `
                                            <p
                                                class="
                                                    taslak-ozet
                                                "
                                            >
                                                ${escapeHtml(
                                                    summary
                                                )}
                                            </p>
                                          `
                                        : ""
                                }


                                <div
                                    class="taslak-tarih"
                                >
                                    Son düzenleme:
                                    ${escapeHtml(
                                        formatDate(
                                            getDate(
                                                draft
                                            )
                                        )
                                    )}
                                </div>

                            </div>


                            <div
                                class="taslak-actions"
                            >

                                <a
                                    href="yeni-haber.html?draft=${encodeURIComponent(
                                        id
                                    )}"
                                    class="
                                        taslak-btn
                                        taslak-duzenle
                                    "
                                >
                                    Düzenle
                                </a>


                                <button
                                    type="button"
                                    class="
                                        taslak-btn
                                        taslak-yayinla
                                    "
                                    data-publish-id="${escapeHtml(
                                        id
                                    )}"
                                >
                                    Yayınla
                                </button>


                                <button
                                    type="button"
                                    class="
                                        taslak-btn
                                        taslak-sil
                                    "
                                    data-delete-id="${escapeHtml(
                                        id
                                    )}"
                                >
                                    Sil
                                </button>

                            </div>

                        </article>

                    `;

                }


                /* =================================================
                   RENDER
                   ================================================= */

                function renderDrafts() {

                    const drafts =
                        getDrafts();


                    updateStats(
                        drafts
                    );


                    const search =
                        searchInput.value
                            .trim()
                            .toLocaleLowerCase(
                                "tr-TR"
                            );


                    const category =
                        categoryFilter.value;


                    let filtered =
                        drafts.filter(
                            function (
                                item
                            ) {

                                const title =
                                    getTitle(
                                        item
                                    )
                                    .toLocaleLowerCase(
                                        "tr-TR"
                                    );


                                const summary =
                                    getSummary(
                                        item
                                    )
                                    .toLocaleLowerCase(
                                        "tr-TR"
                                    );


                                const itemCategory =
                                    getCategory(
                                        item
                                    );


                                const matchesSearch =
                                    !search ||
                                    title.includes(
                                        search
                                    ) ||
                                    summary.includes(
                                        search
                                    );


                                const matchesCategory =
                                    !category ||
                                    itemCategory ===
                                        category;


                                return (
                                    matchesSearch &&
                                    matchesCategory
                                );

                            }
                        );


                    filtered.sort(
                        function (
                            a,
                            b
                        ) {

                            const dateA =
                                new Date(
                                    getDate(a) ||
                                    0
                                ).getTime();


                            const dateB =
                                new Date(
                                    getDate(b) ||
                                    0
                                ).getTime();


                            return (
                                dateB -
                                dateA
                            );

                        }
                    );


                    if (
                        filtered.length ===
                        0
                    ) {

                        list.innerHTML = `

                            <div
                                class="taslak-bos"
                            >

                                <div
                                    class="taslak-bos-icon"
                                >
                                    📝
                                </div>

                                <h2>
                                    Taslak bulunamadı
                                </h2>

                                <p>
                                    Henüz kaydedilmiş
                                    bir taslak yok veya
                                    filtrelerinize uygun
                                    sonuç bulunamadı.
                                </p>

                            </div>

                        `;

                        return;

                    }


                    list.innerHTML =
                        filtered
                            .map(
                                createCard
                            )
                            .join("");


                    bindActions();

                }


                /* =================================================
                   AKSİYONLAR
                   ================================================= */

                function bindActions() {

                    document
                        .querySelectorAll(
                            "[data-delete-id]"
                        )
                        .forEach(
                            function (
                                button
                            ) {

                                button.addEventListener(
                                    "click",
                                    function () {

                                        actionId =
                                            this.dataset.deleteId;

                                        actionType =
                                            "delete";

                                        modalTitle.textContent =
                                            "Taslağı Sil";

                                        modalText.textContent =
                                            "Bu taslak kalıcı olarak silinecek. Bu işlem geri alınamaz.";

                                        confirmButton.textContent =
                                            "Taslağı Sil";

                                        modal.classList.add(
                                            "active"
                                        );

                                    }
                                );

                            }
                        );


                    document
                        .querySelectorAll(
                            "[data-publish-id]"
                        )
                        .forEach(
                            function (
                                button
                            ) {

                                button.addEventListener(
                                    "click",
                                    function () {

                                        actionId =
                                            this.dataset.publishId;

                                        actionType =
                                            "publish";

                                        modalTitle.textContent =
                                            "Taslağı Yayınla";

                                        modalText.textContent =
                                            "Bu taslak haber olarak yayınlanacak. Devam etmek istiyor musunuz?";

                                        confirmButton.textContent =
                                            "Yayınla";

                                        modal.classList.add(
                                            "active"
                                        );

                                    }
                                );

                            }
                        );

                }


                /* =================================================
                   MODAL
                   ================================================= */

                function closeModal() {

                    modal.classList.remove(
                        "active"
                    );

                    actionId =
                        null;

                    actionType =
                        null;

                }


                cancelButton.addEventListener(
                    "click",
                    closeModal
                );


                confirmButton.addEventListener(
                    "click",
                    function () {

                        if (
                            !actionId ||
                            !actionType
                        ) {

                            closeModal();

                            return;

                        }


                        if (
                            actionType ===
                            "delete"
                        ) {

                            deleteDraft();

                        }


                        if (
                            actionType ===
                            "publish"
                        ) {

                            publishDraft();

                        }

                    }
                );


                modal.addEventListener(
                    "click",
                    function (
                        event
                    ) {

                        if (
                            event.target ===
                            modal
                        ) {

                            closeModal();

                        }

                    }
                );


                document.addEventListener(
                    "keydown",
                    function (
                        event
                    ) {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            closeModal();

                        }

                    }
                );


                /* =================================================
                   TASLAK SİL
                   ================================================= */

                function deleteDraft() {

                    const drafts =
                        getDrafts();


                    const oldLength =
                        drafts.length;


                    const updated =
                        drafts.filter(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) !==
                                String(
                                    actionId
                                );

                            }
                        );


                    if (
                        updated.length ===
                        oldLength
                    ) {

                        closeModal();

                        showToast(
                            "Taslak bulunamadı."
                        );

                        return;

                    }


                    saveDrafts(
                        updated
                    );


                    closeModal();


                    renderDrafts();


                    showToast(
                        "Taslak başarıyla silindi."
                    );

                }


                /* =================================================
                   TASLAK YAYINLA
                   ================================================= */

                function publishDraft() {

                    const drafts =
                        getDrafts();


                    const draft =
                        drafts.find(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) ===
                                String(
                                    actionId
                                );

                            }
                        );


                    if (!draft) {

                        closeModal();

                        showToast(
                            "Taslak bulunamadı."
                        );

                        return;

                    }


                    const news =
                        getNews();


                    const existingIndex =
                        news.findIndex(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) ===
                                String(
                                    draft.id
                                );

                            }
                        );


                    const title =
                        getTitle(
                            draft
                        );


                    /*
                     * Taslak yayınlanırken
                     * benzersiz slug oluştur.
                     */

                    const slug =
                        draft.slug ||
                        draft.seoSlug ||
                        createUniqueSlug(
                            title,
                            news,
                            existingIndex !==
                                -1
                                ? news[
                                    existingIndex
                                ].id
                                : draft.id
                        );


                    const now =
                        new Date().toISOString();


                    const existingViews =
                        existingIndex !==
                        -1
                            ? Number(
                                news[
                                    existingIndex
                                ].views ||
                                news[
                                    existingIndex
                                ].goruntulenme ||
                                0
                            )
                            : 0;


                    const publishedNews = {

                        id:
                            draft.id,

                        title:
                            title,

                        summary:
                            getSummary(
                                draft
                            ),

                        content:
                            draft.content ||
                            draft.icerik ||
                            "",

                        category:
                            draft.category ||
                            draft.kategori ||
                            "",

                        status:
                            "published",

                        breaking:
                            draft.breaking ===
                                true ||
                            draft.breaking ===
                                "true" ||
                            draft.sonDakika ===
                                true ||
                            draft.sonDakika ===
                                "true",

                        image:
                            getImage(
                                draft
                            ) ===
                            fallbackImage
                                ? ""
                                : getImage(
                                    draft
                                ),

                        slug:
                            slug,

                        seoSlug:
                            slug,

                        views:
                            existingViews,

                        goruntulenme:
                            existingViews,

                        createdAt:
                            draft.createdAt ||
                            draft.created_at ||
                            now,

                        publishedAt:
                            now,

                        updatedAt:
                            now

                    };


                    if (
                        existingIndex !==
                        -1
                    ) {

                        news[
                            existingIndex
                        ] = {
                            ...news[
                                existingIndex
                            ],
                            ...publishedNews
                        };

                    } else {

                        news.unshift(
                            publishedNews
                        );

                    }


                    saveNews(
                        news
                    );


                    /*
                     * Yayınlanan taslağı
                     * taslak listesinden kaldır.
                     */

                    const remaining =
                        drafts.filter(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) !==
                                String(
                                    actionId
                                );

                            }
                        );


                    saveDrafts(
                        remaining
                    );


                    closeModal();


                    showToast(
                        "Haber yayınlandı. Haberler sayfasına yönlendiriliyorsunuz..."
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "haberler.html";

                        },
                        700
                    );

                }


                /* =================================================
                   ARAMA
                   ================================================= */

                searchInput.addEventListener(
                    "input",
                    renderDrafts
                );


                /* =================================================
                   KATEGORİ
                   ================================================= */

                categoryFilter.addEventListener(
                    "change",
                    renderDrafts
                );


                /* =================================================
                   MOBİL MENÜ
                   ================================================= */

                if (
                    adminMenuBtn &&
                    adminSidebar
                ) {

                    adminMenuBtn.addEventListener(
                        "click",
                        function () {

                            const isOpen =
                                adminSidebar.classList.toggle(
                                    "open"
                                );


                            adminMenuBtn.setAttribute(
                                "aria-expanded",
                                String(
                                    isOpen
                                )
                            );

                        }
                    );


                    document.addEventListener(
                        "click",
                        function (
                            event
                        ) {

                            if (
                                window.innerWidth >
                                900
                            ) {
                                return;
                            }


                            if (
                                !adminSidebar.contains(
                                    event.target
                                ) &&
                                !adminMenuBtn.contains(
                                    event.target
                                )
                            ) {

                                adminSidebar.classList.remove(
                                    "open"
                                );

                                adminMenuBtn.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );

                            }

                        }
                    );

                }


                /* =================================================
                   BAŞLAT
                   ================================================= */

                renderDrafts();

            });

    </script>

</body>
</html>
