<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taslaklar | Akçaabat Haber</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .taslak-sayfa {
            width: 100%;
        }

        .taslak-istatistik-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .taslak-istatistik {
            padding: 20px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .taslak-istatistik-label {
            margin-bottom: 8px;
            color: #777;
            font-size: 13px;
        }

        .taslak-istatistik-value {
            color: #222;
            font-size: 28px;
            font-weight: 800;
        }

        .taslak-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .taslak-toolbar input,
        .taslak-toolbar select {
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            background: #fff;
        }

        .taslak-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .taslak-toolbar input:focus,
        .taslak-toolbar select:focus {
            border-color: #b40018;
        }

        .taslak-liste {
            display: grid;
            gap: 15px;
        }

        .taslak-card {
            display: grid;
            grid-template-columns: 180px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .taslak-gorsel {
            width: 180px;
            height: 120px;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
        }

        .taslak-gorsel img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .taslak-bilgi {
            min-width: 0;
        }

        .taslak-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 7px;
        }

        .taslak-etiket {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 5px;
            background: #f0f0f0;
            color: #555;
            font-size: 11px;
            font-weight: 800;
        }

        .taslak-etiket.son-dakika {
            background: #111;
            color: #fff;
        }

        .taslak-baslik {
            margin: 0 0 8px;
            color: #222;
            font-size: 19px;
            line-height: 1.35;
        }

        .taslak-ozet {
            margin: 0 0 9px;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        .taslak-tarih {
            color: #999;
            font-size: 12px;
        }

        .taslak-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 105px;
        }

        .taslak-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 0 12px;
            border: 0;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .taslak-duzenle {
            background: #eee;
            color: #222;
        }

        .taslak-yayinla {
            background: #b40018;
            color: #fff;
        }

        .taslak-sil {
            background: #222;
            color: #fff;
        }

        .taslak-bos {
            padding: 60px 20px;
            border-radius: 12px;
            background: #fff;
            text-align: center;
            color: #777;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .taslak-bos h2 {
            margin: 0 0 10px;
            color: #222;
        }

        .taslak-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.55);
        }

        .taslak-modal.active {
            display: flex;
        }

        .taslak-modal-box {
            width: 100%;
            max-width: 440px;
            padding: 28px;
            border-radius: 14px;
            background: #fff;
            text-align: center;
        }

        .taslak-modal-box h2 {
            margin: 0 0 10px;
        }

        .taslak-modal-box p {
            margin: 0 0 22px;
            color: #777;
            line-height: 1.5;
        }

        .taslak-modal-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .taslak-modal-actions button {
            min-height: 40px;
            padding: 0 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        #taslakIptal {
            background: #eee;
            color: #222;
        }

        #taslakOnayla {
            background: #b40018;
            color: #fff;
        }

        @media (max-width: 1000px) {
            .taslak-istatistik-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .taslak-card {
                grid-template-columns: 140px 1fr;
            }

            .taslak-gorsel {
                width: 140px;
                height: 100px;
            }

            .taslak-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: flex-end;
            }
        }

        @media (max-width: 650px) {
            .taslak-istatistik-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .taslak-istatistik {
                padding: 15px;
            }

            .taslak-istatistik-value {
                font-size: 23px;
            }

            .taslak-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .taslak-toolbar input,
            .taslak-toolbar select {
                width: 100%;
            }

            .taslak-card {
                grid-template-columns: 1fr;
            }

            .taslak-gorsel {
                width: 100%;
                height: 190px;
            }

            .taslak-actions {
                grid-column: auto;
                flex-direction: row;
            }

            .taslak-btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>

        <!-- =================================================

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   ELEMENTLER
                   ================================================= */

                const list =
                    document.getElementById(
                        "taslakListesi"
                    );

                const searchInput =
                    document.getElementById(
                        "taslakArama"
                    );

                const categoryFilter =
                    document.getElementById(
                        "taslakKategori"
                    );

                const modal =
                    document.getElementById(
                        "taslakModal"
                    );

                const modalTitle =
                    document.getElementById(
                        "modalTitle"
                    );

                const modalText =
                    document.getElementById(
                        "modalText"
                    );

                const cancelButton =
                    document.getElementById(
                        "taslakIptal"
                    );

                const confirmButton =
                    document.getElementById(
                        "taslakOnayla"
                    );


                let actionId = null;
                let actionType = null;


                /* =================================================
                   STORAGE
                   ================================================= */

                function getDrafts() {

                    return JSON.parse(
                        localStorage.getItem(
                            "akcaabat_taslaklar"
                        ) || "[]"
                    );

                }


                function saveDrafts(
                    drafts
                ) {

                    localStorage.setItem(
                        "akcaabat_taslaklar",
                        JSON.stringify(
                            drafts
                        )
                    );

                }


                function getNews() {

                    return JSON.parse(
                        localStorage.getItem(
                            "akcaabat_haberler"
                        ) || "[]"
                    );

                }


                function saveNews(
                    news
                ) {

                    localStorage.setItem(
                        "akcaabat_haberler",
                        JSON.stringify(
                            news
                        )
                    );

                }


                /* =================================================
                   ESCAPE
                   ================================================= */

                function escapeHtml(
                    value
                ) {

                    if (
                        value === null ||
                        value === undefined
                    ) {
                        return "";
                    }

                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                /* =================================================
                   FALLBACK
                   ================================================= */

                const fallbackImage =
                    "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80";


                function getImage(
                    draft
                ) {

                    if (
                        draft.image &&
                        typeof draft.image ===
                            "string" &&
                        draft.image.trim() !== ""
                    ) {

                        return draft.image;

                    }

                    return fallbackImage;

                }


                /* =================================================
                   TARİH
                   ================================================= */

                function getDate(
                    draft
                ) {

                    return (
                        draft.updatedAt ||
                        draft.createdAt ||
                        ""
                    );

                }


                function formatDate(
                    value
                ) {

                    if (!value) {
                        return "Tarih yok";
                    }

                    const date =
                        new Date(value);

                    if (
                        isNaN(
                            date.getTime()
                        )
                    ) {

                        return value;

                    }

                    return date.toLocaleString(
                        "tr-TR",
                        {
                            day: "2-digit",
                            month: "2-digit",
                            year: "numeric",
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

                }


                /* =================================================
                   İSTATİSTİK
                   ================================================= */

                function updateStats(
                    drafts
                ) {

                    const total =
                        drafts.length;


                    const breaking =
                        drafts.filter(
                            function (
                                item
                            ) {

                                return (
                                    item.breaking ===
                                    true
                                );

                            }
                        ).length;


                    const categorized =
                        drafts.filter(
                            function (
                                item
                            ) {

                                return (
                                    item.category &&
                                    item.category.trim()
                                );

                            }
                        ).length;


                    document.getElementById(
                        "toplamTaslak"
                    ).textContent =
                        total;


                    document.getElementById(
                        "sonDakikaTaslak"
                    ).textContent =
                        breaking;


                    document.getElementById(
                        "kategoriliTaslak"
                    ).textContent =
                        categorized;

                }


                /* =================================================
                   TASLAK KARTI
                   ================================================= */

                function createCard(
                    draft
                ) {

                    const title =
                        draft.title ||
                        draft.baslik ||
                        "Başlıksız Taslak";


                    const summary =
                        draft.summary ||
                        draft.ozet ||
                        "";


                    const category =
                        draft.category ||
                        draft.kategori ||
                        "Kategori yok";


                    const id =
                        draft.id;


                    return `

                        <article
                            class="taslak-card"
                        >

                            <div
                                class="taslak-gorsel"
                            >

                                <img
                                    src="${escapeHtml(
                                        getImage(
                                            draft
                                        )
                                    )}"
                                    alt="${escapeHtml(
                                        title
                                    )}"
                                    onerror="
                                        this.src='${fallbackImage}'
                                    "
                                >

                            </div>


                            <div
                                class="taslak-bilgi"
                            >

                                <div
                                    class="taslak-meta"
                                >

                                    <span
                                        class="taslak-etiket"
                                    >
                                        ${escapeHtml(
                                            category
                                        )}
                                    </span>


                                    ${
                                        draft.breaking
                                            ? `
                                                <span
                                                    class="
                                                        taslak-etiket
                                                        son-dakika
                                                    "
                                                >
                                                    ● SON DAKİKA
                                                </span>
                                              `
                                            : ""
                                    }

                                </div>


                                <h2
                                    class="taslak-baslik"
                                >
                                    ${escapeHtml(
                                        title
                                    )}
                                </h2>


                                ${
                                    summary
                                        ? `
                                            <p
                                                class="
                                                    taslak-ozet
                                                "
                                            >
                                                ${escapeHtml(
                                                    summary
                                                )}
                                            </p>
                                          `
                                        : ""
                                }


                                <div
                                    class="taslak-tarih"
                                >
                                    Son düzenleme:
                                    ${escapeHtml(
                                        formatDate(
                                            getDate(
                                                draft
                                            )
                                        )
                                    )}
                                </div>

                            </div>


                            <div
                                class="taslak-actions"
                            >

                                <a
                                    href="
                                        yeni-haber.html?draft=${encodeURIComponent(
                                            id
                                        )}
                                    "
                                    class="
                                        taslak-btn
                                        taslak-duzenle
                                    "
                                >
                                    Düzenle
                                </a>


                                <button
                                    type="button"
                                    class="
                                        taslak-btn
                                        taslak-yayinla
                                    "
                                    data-publish-id="${escapeHtml(
                                        id
                                    )}"
                                >
                                    Yayınla
                                </button>


                                <button
                                    type="button"
                                    class="
                                        taslak-btn
                                        taslak-sil
                                    "
                                    data-delete-id="${escapeHtml(
                                        id
                                    )}"
                                >
                                    Sil
                                </button>

                            </div>

                        </article>

                    `;

                }


                /* =================================================
                   LİSTELE
                   ================================================= */

                function renderDrafts() {

                    const drafts =
                        getDrafts();


                    updateStats(
                        drafts
                    );


                    const search =
                        searchInput.value
                            .trim()
                            .toLocaleLowerCase(
                                "tr-TR"
                            );


                    const category =
                        categoryFilter.value;


                    let filtered =
                        drafts.filter(
                            function (
                                item
                            ) {

                                const title =
                                    (
                                        item.title ||
                                        item.baslik ||
                                        ""
                                    )
                                    .toLocaleLowerCase(
                                        "tr-TR"
                                    );


                                const summary =
                                    (
                                        item.summary ||
                                        item.ozet ||
                                        ""
                                    )
                                    .toLocaleLowerCase(
                                        "tr-TR"
                                    );


                                const itemCategory =
                                    item.category ||
                                    item.kategori ||
                                    "";


                                const matchesSearch =
                                    !search ||
                                    title.includes(
                                        search
                                    ) ||
                                    summary.includes(
                                        search
                                    );


                                const matchesCategory =
                                    !category ||
                                    itemCategory ===
                                        category;


                                return (
                                    matchesSearch &&
                                    matchesCategory
                                );

                            }
                        );


                    filtered.sort(
                        function (
                            a,
                            b
                        ) {

                            return (
                                new Date(
                                    getDate(b) ||
                                    0
                                ) -
                                new Date(
                                    getDate(a) ||
                                    0
                                )
                            );

                        }
                    );


                    if (
                        filtered.length ===
                        0
                    ) {

                        list.innerHTML = `

                            <div
                                class="taslak-bos"
                            >

                                <h2>
                                    Taslak bulunamadı
                                </h2>

                                <p>
                                    Henüz kaydedilmiş
                                    bir taslak yok veya
                                    filtrelerinize uygun
                                    sonuç bulunamadı.
                                </p>

                            </div>

                        `;

                        return;

                    }


                    list.innerHTML =
                        filtered
                            .map(
                                createCard
                            )
                            .join("");


                    bindActions();

                }


                /* =================================================
                   BUTONLARI BAĞLA
                   ================================================= */

                function bindActions() {


                    document
                        .querySelectorAll(
                            "[data-delete-id]"
                        )
                        .forEach(
                            function (
                                button
                            ) {

                                button.addEventListener(
                                    "click",
                                    function () {

                                        actionId =
                                            this.dataset.deleteId;

                                        actionType =
                                            "delete";

                                        modalTitle.textContent =
                                            "Taslağı Sil";

                                        modalText.textContent =
                                            "Bu taslak kalıcı olarak silinecek. Bu işlem geri alınamaz.";

                                        modal.classList.add(
                                            "active"
                                        );

                                    }
                                );

                            }
                        );


                    document
                        .querySelectorAll(
                            "[data-publish-id]"
                        )
                        .forEach(
                            function (
                                button
                            ) {

                                button.addEventListener(
                                    "click",
                                    function () {

                                        actionId =
                                            this.dataset.publishId;

                                        actionType =
                                            "publish";

                                        modalTitle.textContent =
                                            "Taslağı Yayınla";

                                        modalText.textContent =
                                            "Bu taslak haber olarak yayınlanacak.";

                                        modal.classList.add(
                                            "active"
                                        );

                                    }
                                );

                            }
                        );

                }


                /* =================================================
                   MODAL İPTAL
                   ================================================= */

                cancelButton.addEventListener(
                    "click",
                    function () {

                        closeModal();

                    }
                );


                function closeModal() {

                    modal.classList.remove(
                        "active"
                    );

                    actionId =
                        null;

                    actionType =
                        null;

                }


                /* =================================================
                   MODAL ONAY
                   ================================================= */

                confirmButton.addEventListener(
                    "click",
                    function () {

                        if (
                            !actionId ||
                            !actionType
                        ) {

                            closeModal();

                            return;

                        }


                        if (
                            actionType ===
                            "delete"
                        ) {

                            deleteDraft();

                        }


                        if (
                            actionType ===
                            "publish"
                        ) {

                            publishDraft();

                        }


                        closeModal();

                    }
                );


                /* =================================================
                   TASLAK SİL
                   ================================================= */

                function deleteDraft() {

                    const drafts =
                        getDrafts();


                    const updated =
                        drafts.filter(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) !==
                                String(
                                    actionId
                                );

                            }
                        );


                    saveDrafts(
                        updated
                    );


                    renderDrafts();

                }


                /* =================================================
                   TASLAK YAYINLA
                   ================================================= */

                function publishDraft() {

                    const drafts =
                        getDrafts();


                    const draft =
                        drafts.find(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) ===
                                String(
                                    actionId
                                );

                            }
                        );


                    if (!draft) {

                        alert(
                            "Taslak bulunamadı."
                        );

                        return;

                    }


                    const news =
                        getNews();


                    /*
                     * Aynı ID ile haber varsa
                     * güncelle.
                     */

                    const existingIndex =
                        news.findIndex(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) ===
                                String(
                                    draft.id
                                );

                            }
                        );


                    const publishedNews = {

                        id:
                            draft.id,

                        title:
                            draft.title ||
                            "",

                        summary:
                            draft.summary ||
                            "",

                        content:
                            draft.content ||
                            "",

                        category:
                            draft.category ||
                            "",

                        status:
                            "published",

                        breaking:
                            draft.breaking ===
                            true,

                        image:
                            draft.image ||
                            "",

                        views:
                            existingIndex !== -1
                                ? Number(
                                    news[
                                        existingIndex
                                    ].views || 0
                                )
                                : 0,

                        publishedAt:
                            new Date().toISOString(),

                        createdAt:
                            draft.createdAt ||
                            new Date().toISOString(),

                        updatedAt:
                            new Date().toISOString()

                    };


                    if (
                        existingIndex !==
                        -1
                    ) {

                        news[
                            existingIndex
                        ] =
                            {
                                ...news[
                                    existingIndex
                                ],
                                ...publishedNews
                            };

                    } else {

                        news.unshift(
                            publishedNews
                        );

                    }


                    saveNews(
                        news
                    );


                    /*
                     * Taslağı kaldır
                     */

                    const remaining =
                        drafts.filter(
                            function (
                                item
                            ) {

                                return String(
                                    item.id
                                ) !==
                                String(
                                    actionId
                                );

                            }
                        );


                    saveDrafts(
                        remaining
                    );


                    /*
                     * Haber yönetimine git
                     */

                    window.location.href =
                        "haber.html";

                }


                /* =================================================
                   ARAMA / FİLTRE
                   ================================================= */

                searchInput.addEventListener(
                    "input",
                    renderDrafts
                );


                categoryFilter.addEventListener(
                    "change",
                    renderDrafts
                );


                /* =================================================
                   MODAL DIŞINA TIKLAMA
                   ================================================= */

                modal.addEventListener(
                    "click",
                    function (
                        event
                    ) {

                        if (
                            event.target ===
                            modal
                        ) {

                            closeModal();

                        }

                    }
                );


                /* =================================================
                   ESC
                   ================================================= */

                document.addEventListener(
                    "keydown",
                    function (
                        event
                    ) {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            closeModal();

                        }

                    }
                );


                /* =================================================
                   MOBİL ADMIN MENÜ
                   ================================================= */

                const adminMenuBtn =
                    document.getElementById(
                        "adminMenuBtn"
                    );

                const adminSidebar =
                    document.getElementById(
                        "adminSidebar"
                    );


                if (
                    adminMenuBtn &&
                    adminSidebar
                ) {

                    adminMenuBtn.addEventListener(
                        "click",
                        function () {

                            adminSidebar.classList.toggle(
                                "open"
                            );

                        }
                    );

                }


                /* =================================================
                   BAŞLAT
                   ================================================= */

                renderDrafts();

            });

    </script>

</body>
</html>
