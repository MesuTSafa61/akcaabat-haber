<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trabzon ve Akçaabat Hava Durumu | Akçaabat Haber</title>
  <meta name="description" content="Trabzon, Akçaabat ve Akçaabat mahalleleri için güncel hava durumu ve 5 günlük tahmin.">
  <link rel="canonical" href="https://akcaabathaber.com.tr/hava-durumu.html"><link rel="stylesheet" href="style.css?v=9"><link rel="stylesheet" href="portal-shell.css?v=11">
  <style>
  .weather-page{padding:28px 0 55px}.weather-hero{padding:24px 27px;background:#071a33;color:#fff;border-left:6px solid #1594ca}.weather-hero small{color:#7bd0f5;font-weight:900}.weather-hero h1{margin:4px 0;font-size:30px}.weather-hero p{margin:0;color:#c7d5e5}.weather-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.weather-card{background:#fff;border-top:4px solid #1594ca;box-shadow:0 3px 12px rgba(7,26,51,.08);padding:17px}.weather-card.primary{border-top-color:#d71920}.weather-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.weather-head h2{margin:0;color:#071a33;font-size:18px}.weather-icon{font-size:28px}.weather-current{display:flex;align-items:end;gap:11px;margin:13px 0}.weather-temp{font-size:38px;line-height:1;font-weight:950;color:#071a33}.weather-meta{display:grid;gap:3px;color:#667085;font-size:11px}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;border-top:1px solid #e4e9ef;padding-top:12px}.forecast div{text-align:center;font-size:10px;color:#667085}.forecast strong{display:block;color:#111827;margin-top:4px}.weather-empty{grid-column:1/-1;padding:28px;background:#fff;border-left:5px solid #d71920;color:#667085}.weather-source{margin-top:14px;color:#667085;font-size:11px}@media(max-width:900px){.weather-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.weather-page{padding-top:18px}.weather-hero{padding:20px}.weather-hero h1{font-size:24px}.weather-grid{grid-template-columns:1fr}.weather-card{padding:15px}}
  </style>
</head>
<body>
  <main class="container weather-page">
    <section class="weather-hero"><small>GÜNCEL HAVA</small><h1>Trabzon ve Akçaabat Hava Durumu</h1><p>Önce Trabzon, ardından Akçaabat ve mahalleleri için canlı ölçüm ve 5 günlük tahmin.</p></section>
    <section class="weather-grid" id="weatherGrid"><div class="weather-empty">Hava durumu verileri yükleniyor…</div></section>
    <p class="weather-source">Veriler Open-Meteo tahmin servisinden alınır; ölçümler konuma en yakın tahmin noktasını gösterir.</p>
  </main>
  <script>
  (function(){"use strict";
    const locations=[
      {name:"Trabzon",lat:41.0027,lon:39.7168,primary:true},{name:"Akçaabat",lat:41.0197,lon:39.5716,primary:true},
      {name:"Söğütlü",lat:41.0064,lon:39.6138},{name:"Yıldızlı",lat:40.9908,lon:39.6060},{name:"Yaylacık",lat:41.0108,lon:39.5861},{name:"Dürbinar",lat:41.0158,lon:39.5740},{name:"Darıca",lat:41.0281,lon:39.5269},{name:"Akçakale",lat:41.0651,lon:39.4345},{name:"Mersin",lat:41.0940,lon:39.3560}
    ];
    const grid=document.getElementById("weatherGrid"),esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);
    const icon=code=>code===0?"☀️":code<=3?"⛅":code<=48?"🌫️":code<=67?"🌧️":code<=77?"🌨️":code<=82?"🌦️":code<=99?"⛈️":"☁️";
    const day=value=>new Date(value+"T12:00:00").toLocaleDateString("tr-TR",{weekday:"short"});
    async function getWeather(location){const url="https://api.open-meteo.com/v1/forecast?latitude="+location.lat+"&longitude="+location.lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FIstanbul&forecast_days=5";const response=await fetch(url);if(!response.ok)throw new Error();return{location,data:await response.json()}}
    function card(item){const c=item.data.current,d=item.data.daily;return'<article class="weather-card'+(item.location.primary?' primary':'')+'"><div class="weather-head"><h2>'+esc(item.location.name)+'</h2><span class="weather-icon">'+icon(c.weather_code)+'</span></div><div class="weather-current"><span class="weather-temp">'+Math.round(c.temperature_2m)+'°</span><span class="weather-meta"><span>Hissedilen '+Math.round(c.apparent_temperature)+'°</span><span>Nem %'+Math.round(c.relative_humidity_2m)+'</span><span>Rüzgâr '+Math.round(c.wind_speed_10m)+' km/sa</span></span></div><div class="forecast">'+d.time.map((date,i)=>'<div>'+day(date)+'<br>'+icon(d.weather_code[i])+'<strong>'+Math.round(d.temperature_2m_max[i])+'° / '+Math.round(d.temperature_2m_min[i])+'°</strong></div>').join('')+'</div></article>'}
    Promise.all(locations.map(getWeather)).then(items=>{grid.innerHTML=items.map(card).join('')}).catch(()=>{grid.innerHTML='<div class="weather-empty"><strong>Hava durumu şu anda alınamıyor.</strong><br>Lütfen kısa süre sonra yeniden deneyin.</div>'});
  })();
  </script><script src="portal-shell.js?v=13"></script>
</body></html>
