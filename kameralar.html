<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Akçaabat ve Trabzon Kameraları | Akçaabat Haber</title>
  <meta name="description" content="Akçaabat ve Trabzon için doğrulanmış şehir kamerası bağlantıları.">
  <link rel="canonical" href="https://akcaabathaber.com.tr/kameralar.html"><link rel="stylesheet" href="style.css?v=9"><link rel="stylesheet" href="portal-shell.css?v=16">
  <style>
    .service-page{padding:28px 0 55px}.service-hero{padding:25px 28px;background:#071a33;color:#fff;border-left:6px solid #d71920}.service-hero small{color:#75c8ee;font-weight:900}.service-hero h1{margin:4px 0;font-size:30px}.service-hero p{margin:0;color:#c8d5e4}.filter-row{display:flex;gap:8px;margin:18px 0}.filter-row button{padding:9px 14px;border:1px solid #dce2e8;background:#fff;font-weight:800}.filter-row button.active{background:#d71920;color:#fff;border-color:#d71920}.camera-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.camera-card{background:#fff;box-shadow:0 2px 9px rgba(7,27,54,.08)}.camera-screen{aspect-ratio:16/9;background:#071a33;display:grid;place-items:center;color:#a8bad0;position:relative}.camera-screen iframe,.camera-screen video{width:100%;height:100%;border:0}.camera-status{position:absolute;top:10px;left:10px;padding:4px 7px;background:#159447;color:#fff;font-size:9px;font-weight:900}.camera-status.source{background:#1594ca}.camera-body{padding:14px}.camera-body small{color:#d71920;font-weight:900}.camera-body h2{font-size:17px;margin:3px 0}.camera-body p{font-size:12px;color:#667085}.camera-actions{display:flex;gap:8px;flex-wrap:wrap}.camera-actions a{padding:8px 10px;background:#071a33;color:#fff;font-size:11px;font-weight:800}.service-empty{padding:30px;background:#fff;border-left:5px solid #d71920;color:#667085}.service-empty strong{display:block;color:#071a33;font-size:18px}@media(max-width:800px){.camera-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.camera-grid{grid-template-columns:1fr}.service-hero{padding:21px}.service-hero h1{font-size:24px}}
  </style>
</head>
<body>
  <div id="portalHeader"></div>
  <main class="container service-page">
    <section class="service-hero"><small>CANLI SERVİSLER</small><h1>Kameralar / MOBESE</h1><p>Yalnızca yönetim panelinde doğrulanmış Akçaabat ve Trabzon kaynakları gösterilir.</p></section>
    <div class="filter-row"><button class="active" data-city="all">Tümü</button><button data-city="Akçaabat">Akçaabat</button><button data-city="Trabzon">Trabzon</button></div>
    <section class="camera-grid" id="cameraGrid"><div class="service-empty"><strong>Kameralar yükleniyor</strong><span>Lütfen bekleyin.</span></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="script.js?v=9"></script>
  <script>
  (function(){"use strict";const grid=document.getElementById("cameraGrid");let cameras=[];const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);function render(city){const rows=city==="all"?cameras:cameras.filter(x=>x.city===city);if(!rows.length){grid.innerHTML='<div class="service-empty"><strong>Doğrulanmış kamera bulunmuyor</strong><span>Kaynak eklendiğinde burada otomatik yayınlanacaktır.</span></div>';return}grid.innerHTML=rows.map(x=>'<article class="camera-card"><div class="camera-screen">'+(x.embed_url?'<iframe src="'+esc(x.embed_url)+'" title="'+esc(x.name)+'" loading="lazy" allowfullscreen></iframe>':'<span>Resmî kamera sayfasını açın</span>')+'<span class="camera-status'+(x.embed_url?'':' source')+'">'+(x.embed_url?'CANLI YAYIN':'RESMÎ KAYNAK')+'</span></div><div class="camera-body"><small>'+esc(x.city+(x.district?' • '+x.district:''))+'</small><h2>'+esc(x.name)+'</h2><p>'+esc(x.location||'Konum bilgisi')+' • Kaynak: '+esc(x.source_name)+'</p><div class="camera-actions">'+(x.stream_url?'<a href="'+esc(x.stream_url)+'" target="_blank" rel="noopener">Resmî Sayfada Aç</a>':'')+'<a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">Kaynağı Doğrula</a></div></div></article>').join('')}document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-city]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.city)});(async()=>{try{const c=window.supabase.createClient(window.AKCAABAT_SUPABASE.url,window.AKCAABAT_SUPABASE.key);const r=await c.from('live_cameras').select('id,name,city,district,location,stream_url,embed_url,source_name,source_url,sort_order').eq('is_active',true).order('city').order('sort_order');if(r.error)throw r.error;cameras=r.data||[];render('all')}catch(e){console.error(e);grid.innerHTML='<div class="service-empty"><strong>Yayın şu anda kullanılamıyor</strong><span>Kamera kaynağına erişilemedi. Lütfen daha sonra tekrar deneyin.</span></div>'}})()})();
  </script><script src="portal-shell.js?v=17"></script>
</body></html>
