<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yeni Haber | Akçaabat Haber</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         ADMIN HEADER
         ===================================================== -->

    <header class="admin-header">

        <div class="admin-header-left">

            <button
                type="button"
                class="admin-menu-btn"
                id="adminMenuBtn"
            >
                ☰
            </button>

            <a href="index.html" class="admin-logo">
                AKÇAABAT <span>HABER</span>
            </a>

        </div>

        <div class="admin-header-right">

            <a href="index.html" target="_blank">
                Siteyi Gör
            </a>

        </div>

    </header>


    <!-- =====================================================
         ADMIN LAYOUT
         ===================================================== -->

    <div class="admin-layout">


        <!-- SIDEBAR -->

        <aside class="admin-sidebar" id="adminSidebar">

            <div class="admin-sidebar-title">
                Yönetim Paneli
            </div>

            <nav class="admin-nav">

                <a href="admin.html">
                    <span>📊</span>
                    Dashboard
                </a>

                <a href="haber.html">
                    <span>📰</span>
                    Haberler
                </a>

                <a
                    href="yeni-haber.html"
                    class="active"
                >
                    <span>✏️</span>
                    Yeni Haber
                </a>

                <a href="taslaklar.html">
                    <span>📝</span>
                    Taslaklar
                </a>

                <a href="index.html">
                    <span>🌐</span>
                    Siteye Git
                </a>

            </nav>

        </aside>


        <!-- =================================================
             MAIN
             ================================================= -->

        <main class="admin-main">


            <!-- PAGE HEADER -->

            <div class="admin-page-header">

                <div>

                    <h1 id="pageTitle">
                        Yeni Haber
                    </h1>

                    <p id="pageDescription">
                        Yeni bir haber oluştur ve yayınla.
                    </p>

                </div>

                <a
                    href="haber.html"
                    class="admin-secondary-btn"
                >
                    ← Haberler
                </a>

            </div>


            <!-- =================================================
                 FORM
                 ================================================= -->

            <form
                id="haberForm"
                class="admin-form"
            >

                <!-- GİZLİ ID -->

                <input
                    type="hidden"
                    id="haberId"
                >


                <!-- BAŞLIK -->

                <div class="admin-form-group">

                    <label for="haberBaslik">
                        Haber Başlığı
                    </label>

                    <input
                        type="text"
                        id="haberBaslik"
                        name="title"
                        placeholder="Haber başlığını yazın..."
                        required
                    >

                    <small>
                        Dikkat çekici ve anlaşılır bir başlık kullanın.
                    </small>

                </div>


                <!-- ÖZET -->

                <div class="admin-form-group">

                    <label for="haberOzet">
                        Haber Özeti
                    </label>

                    <textarea
                        id="haberOzet"
                        name="summary"
                        rows="4"
                        placeholder="Haberin kısa özetini yazın..."
                    ></textarea>

                </div>


                <!-- İÇERİK -->

                <div class="admin-form-group">

                    <label for="haberIcerik">
                        Haber İçeriği
                    </label>

                    <textarea
                        id="haberIcerik"
                        name="content"
                        rows="14"
                        placeholder="Haberin detaylarını yazın..."
                        required
                    ></textarea>

                </div>


                <!-- KATEGORİ -->

                <div class="admin-form-row">

                    <div class="admin-form-group">

                        <label for="haberKategori">
                            Kategori
                        </label>

                        <select
                            id="haberKategori"
                            name="category"
                            required
                        >

                            <option value="">
                                Kategori seçin
                            </option>

                            <option value="Akçaabat">
                                Akçaabat
                            </option>

                            <option value="Trabzon">
                                Trabzon
                            </option>

                            <option value="Gündem">
                                Gündem
                            </option>

                            <option value="Spor">
                                Spor
                            </option>

                            <option value="Ekonomi">
                                Ekonomi
                            </option>

                            <option value="Siyaset">
                                Siyaset
                            </option>

                            <option value="Magazin">
                                Magazin
                            </option>

                            <option value="Sağlık">
                                Sağlık
                            </option>

                            <option value="Eğitim">
                                Eğitim
                            </option>

                            <option value="Kültür Sanat">
                                Kültür Sanat
                            </option>

                            <option value="Yaşam">
                                Yaşam
                            </option>

                        </select>

                    </div>


                    <!-- DURUM -->

                    <div class="admin-form-group">

                        <label for="haberDurum">
                            Yayın Durumu
                        </label>

                        <select
                            id="haberDurum"
                            name="status"
                        >

                            <option value="published">
                                Yayında
                            </option>

                            <option value="draft">
                                Taslak
                            </option>

                        </select>

                    </div>

                </div>


                <!-- KAPAK GÖRSELİ -->

                <div class="admin-form-group">

                    <label for="haberGorsel">
                        Haber Görseli
                    </label>

                    <input
                        type="file"
                        id="haberGorsel"
                        accept="image/*"
                    >

                    <small>
                        JPG, PNG veya WEBP görsel yükleyebilirsiniz.
                    </small>

                    <div
                        id="imagePreview"
                        class="admin-image-preview"
                    ></div>

                </div>


                <!-- SON DAKİKA -->

                <div class="admin-checkbox-group">

                    <label>

                        <input
                            type="checkbox"
                            id="haberSonDakika"
                        >

                        <span>
                            Bu haberi Son Dakika olarak göster
                        </span>

                    </label>

                </div>


                <!-- BUTONLAR -->

                <div class="admin-form-actions">

                    <button
                        type="button"
                        class="admin-secondary-btn"
                        id="taslakBtn"
                    >
                        📝 Taslak Kaydet
                    </button>

                    <button
                        type="button"
                        class="admin-danger-btn"
                        id="temizleBtn"
                    >
                        Temizle
                    </button>

                    <button
                        type="submit"
                        class="admin-primary-btn"
                    >
                        🚀 Haberi Yayınla
                    </button>

                </div>

            </form>


            <!-- BİLGİ -->

            <div
                id="formMessage"
                class="admin-form-message"
            ></div>


        </main>

    </div>


    <!-- =====================================================
         SCRIPT
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   ELEMENTLER
                   ================================================= */

                const form =
                    document.getElementById("haberForm");

                const titleInput =
                    document.getElementById("haberBaslik");

                const summaryInput =
                    document.getElementById("haberOzet");

                const contentInput =
                    document.getElementById("haberIcerik");

                const categoryInput =
                    document.getElementById("haberKategori");

                const statusInput =
                    document.getElementById("haberDurum");

                const imageInput =
                    document.getElementById("haberGorsel");

                const breakingInput =
                    document.getElementById("haberSonDakika");

                const idInput =
                    document.getElementById("haberId");

                const preview =
                    document.getElementById("imagePreview");

                const message =
                    document.getElementById("formMessage");

                const pageTitle =
                    document.getElementById("pageTitle");

                const pageDescription =
                    document.getElementById("pageDescription");

                const publishButton =
                    form.querySelector(
                        'button[type="submit"]'
                    );


                /* =================================================
                   URL BİLGİLERİ
                   ================================================= */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const draftId =
                    params.get("draft");

                const editId =
                    params.get("edit");


                /* =================================================
                   LOCAL STORAGE
                   ================================================= */

                function getDrafts() {

                    return JSON.parse(
                        localStorage.getItem(
                            "akcaabat_taslaklar"
                        ) || "[]"
                    );

                }


                function getNews() {

                    return JSON.parse(
                        localStorage.getItem(
                            "akcaabat_haberler"
                        ) || "[]"
                    );

                }


                function saveDrafts(items) {

                    localStorage.setItem(
                        "akcaabat_taslaklar",
                        JSON.stringify(items)
                    );

                }


                function saveNews(items) {

                    localStorage.setItem(
                        "akcaabat_haberler",
                        JSON.stringify(items)
                    );

                }


                /* =================================================
                   ID OLUŞTUR
                   ================================================= */

                function createId(prefix) {

                    return (
                        prefix +
                        "_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 8)
                    );

                }


                /* =================================================
                   MESAJ
                   ================================================= */

                function showMessage(
                    text,
                    type = "success"
                ) {

                    message.textContent =
                        text;

                    message.className =
                        "admin-form-message " +
                        type;

                    message.style.display =
                        "block";

                    setTimeout(
                        function () {

                            message.style.display =
                                "none";

                        },
                        3500
                    );

                }


                /* =================================================
                   GÖRSEL ÖNİZLEME
                   ================================================= */

                imageInput.addEventListener(
                    "change",
                    function () {

                        const file =
                            this.files[0];

                        if (!file) {
                            return;
                        }

                        if (
                            !file.type.startsWith(
                                "image/"
                            )
                        ) {

                            showMessage(
                                "Lütfen geçerli bir görsel seçin.",
                                "error"
                            );

                            this.value = "";

                            return;
                        }

                        const reader =
                            new FileReader();

                        reader.onload =
                            function (event) {

                                preview.innerHTML = `
                                    <img
                                        src="${event.target.result}"
                                        alt="Görsel önizleme"
                                    >
                                `;

                            };

                        reader.readAsDataURL(file);

                    }
                );


                /* =================================================
                   FORMU DOLDUR
                   ================================================= */

                function fillForm(item) {

                    if (!item) {
                        return;
                    }

                    idInput.value =
                        item.id || "";

                    titleInput.value =
                        item.title ||
                        item.baslik ||
                        "";

                    summaryInput.value =
                        item.summary ||
                        item.ozet ||
                        "";

                    contentInput.value =
                        item.content ||
                        item.icerik ||
                        "";

                    categoryInput.value =
                        item.category ||
                        item.kategori ||
                        "";

                    statusInput.value =
                        item.status ||
                        "published";

                    breakingInput.checked =
                        item.breaking === true;

                    if (item.image) {

                        preview.innerHTML = `
                            <img
                                src="${item.image}"
                                alt="Haber görseli"
                            >
                        `;

                    }

                }


                /* =================================================
                   TASLAK DÜZENLE
                   ================================================= */

                if (draftId) {

                    const drafts =
                        getDrafts();

                    const draft =
                        drafts.find(
                            function (item) {
                                return String(item.id) ===
                                    String(draftId);
                            }
                        );

                    if (draft) {

                        fillForm(draft);

                        pageTitle.textContent =
                            "Taslağı Düzenle";

                        pageDescription.textContent =
                            "Kaydedilmiş taslağı düzenleyin.";

                        publishButton.textContent =
                            "🚀 Haberi Yayınla";

                    }

                }


                /* =================================================
                   YAYINDAKİ HABERİ DÜZENLE
                   ================================================= */

                if (editId) {

                    const news =
                        getNews();

                    const item =
                        news.find(
                            function (haber) {
                                return String(haber.id) ===
                                    String(editId);
                            }
                        );

                    if (item) {

                        fillForm(item);

                        pageTitle.textContent =
                            "Haberi Düzenle";

                        pageDescription.textContent =
                            "Yayındaki haberin bilgilerini güncelleyin.";

                        publishButton.textContent =
                            "💾 Değişiklikleri Kaydet";

                    }

                }


                /* =================================================
                   VERİLERİ TOPLA
                   ================================================= */

                function getFormData() {

                    return {

                        title:
                            titleInput.value.trim(),

                        summary:
                            summaryInput.value.trim(),

                        content:
                            contentInput.value.trim(),

                        category:
                            categoryInput.value,

                        status:
                            statusInput.value,

                        breaking:
                            breakingInput.checked

                    };

                }


                /* =================================================
                   TASLAK KAYDET
                   ================================================= */

                document
                    .getElementById("taslakBtn")
                    .addEventListener(
                        "click",
                        function () {

                            const data =
                                getFormData();

                            if (!data.title) {

                                showMessage(
                                    "Taslak için en azından başlık girin.",
                                    "error"
                                );

                                titleInput.focus();

                                return;
                            }


                            const drafts =
                                getDrafts();


                            const currentId =
                                idInput.value;


                            const draftData = {

                                id:
                                    currentId ||
                                    createId("draft"),

                                title:
                                    data.title,

                                summary:
                                    data.summary,

                                content:
                                    data.content,

                                category:
                                    data.category,

                                status:
                                    "draft",

                                breaking:
                                    data.breaking,

                                image:
                                    preview.querySelector(
                                        "img"
                                    )?.src || "",

                                updatedAt:
                                    new Date().toISOString(),

                                createdAt:
                                    new Date().toISOString()

                            };


                            const existingIndex =
                                drafts.findIndex(
                                    function (item) {

                                        return String(item.id) ===
                                            String(draftData.id);

                                    }
                                );


                            if (
                                existingIndex !== -1
                            ) {

                                draftData.createdAt =
                                    drafts[
                                        existingIndex
                                    ].createdAt ||
                                    draftData.createdAt;

                                drafts[
                                    existingIndex
                                ] =
                                    draftData;

                            } else {

                                drafts.unshift(
                                    draftData
                                );

                            }


                            saveDrafts(
                                drafts
                            );

                            idInput.value =
                                draftData.id;

                            showMessage(
                                "Taslak başarıyla kaydedildi."
                            );

                        }
                    );


                /* =================================================
                   HABER YAYINLA / GÜNCELLE
                   ================================================= */

                form.addEventListener(
                    "submit",
                    function (event) {

                        event.preventDefault();


                        const data =
                            getFormData();


                        if (!data.title) {

                            showMessage(
                                "Haber başlığı boş bırakılamaz.",
                                "error"
                            );

                            titleInput.focus();

                            return;
                        }


                        if (!data.content) {

                            showMessage(
                                "Haber içeriği boş bırakılamaz.",
                                "error"
                            );

                            contentInput.focus();

                            return;
                        }


                        if (!data.category) {

                            showMessage(
                                "Lütfen kategori seçin.",
                                "error"
                            );

                            categoryInput.focus();

                            return;
                        }


                        const news =
                            getNews();


                        const currentId =
                            idInput.value;


                        /*
                         * MEVCUT HABERİ GÜNCELLE
                         */

                        if (editId) {

                            const index =
                                news.findIndex(
                                    function (item) {

                                        return String(item.id) ===
                                            String(editId);

                                    }
                                );


                            if (index !== -1) {

                                const old =
                                    news[index];


                                news[index] = {

                                    ...old,

                                    title:
                                        data.title,

                                    summary:
                                        data.summary,

                                    content:
                                        data.content,

                                    category:
                                        data.category,

                                    status:
                                        "published",

                                    breaking:
                                        data.breaking,

                                    image:
                                        preview.querySelector(
                                            "img"
                                        )?.src ||
                                        old.image ||
                                        "",

                                    updatedAt:
                                        new Date().toISOString()

                                };


                                saveNews(
                                    news
                                );


                                /*
                                 * Aynı ID'li taslak varsa kaldır
                                 */

                                const drafts =
                                    getDrafts();

                                const cleanDrafts =
                                    drafts.filter(
                                        function (draft) {

                                            return String(
                                                draft.id
                                            ) !==
                                            String(editId);

                                        }
                                    );

                                saveDrafts(
                                    cleanDrafts
                                );


                                showMessage(
                                    "Haber başarıyla güncellendi."
                                );


                                setTimeout(
                                    function () {

                                        window.location.href =
                                            "haber.html";

                                    },
                                    900
                                );


                                return;

                            }

                        }


                        /*
                         * YENİ HABER OLUŞTUR
                         */

                        const newId =
                            currentId ||
                            createId("news");


                        const newNews = {

                            id:
                                newId,

                            title:
                                data.title,

                            summary:
                                data.summary,

                            content:
                                data.content,

                            category:
                                data.category,

                            status:
                                "published",

                            breaking:
                                data.breaking,

                            image:
                                preview.querySelector(
                                    "img"
                                )?.src || "",

                            views:
                                0,

                            publishedAt:
                                new Date().toISOString(),

                            createdAt:
                                new Date().toISOString(),

                            updatedAt:
                                new Date().toISOString()

                        };


                        news.unshift(
                            newNews
                        );


                        saveNews(
                            news
                        );


                        /*
                         * Eğer taslaktan yayınlandıysa
                         * taslağı kaldır
                         */

                        if (draftId) {

                            const drafts =
                                getDrafts();

                            const remaining =
                                drafts.filter(
                                    function (draft) {

                                        return String(
                                            draft.id
                                        ) !==
                                        String(draftId);

                                    }
                                );

                            saveDrafts(
                                remaining
                            );

                        }


                        showMessage(
                            "Haber başarıyla yayınlandı."
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "haber.html";

                            },
                            900
                        );

                    }
                );


                /* =================================================
                   TEMİZLE
                   ================================================= */

                document
                    .getElementById("temizleBtn")
                    .addEventListener(
                        "click",
                        function () {

                            const confirmed =
                                confirm(
                                    "Formdaki tüm bilgiler temizlensin mi?"
                                );

                            if (!confirmed) {
                                return;
                            }

                            form.reset();

                            idInput.value =
                                "";

                            preview.innerHTML =
                                "";

                            showMessage(
                                "Form temizlendi."
                            );

                        }
                    );


                /* =================================================
                   ADMIN MOBİL MENÜ
                   ================================================= */

                const adminMenuBtn =
                    document.getElementById(
                        "adminMenuBtn"
                    );

                const adminSidebar =
                    document.getElementById(
                        "adminSidebar"
                    );

                if (
                    adminMenuBtn &&
                    adminSidebar
                ) {

                    adminMenuBtn.addEventListener(
                        "click",
                        function () {

                            adminSidebar.classList.toggle(
                                "open"
                            );

                        }
                    );

                }


                /* =================================================
                   OTOMATİK TASLAK
                   ================================================= */

                let autoSaveTimer;

                function autoSaveDraft() {

                    const title =
                        titleInput.value.trim();

                    const content =
                        contentInput.value.trim();

                    if (
                        !title &&
                        !content
                    ) {
                        return;
                    }

                    const data =
                        getFormData();

                    const drafts =
                        getDrafts();

                    const autoId =
                        idInput.value ||
                        createId("draft");

                    idInput.value =
                        autoId;


                    const index =
                        drafts.findIndex(
                            function (item) {

                                return String(item.id) ===
                                    String(autoId);

                            }
                        );


                    const item = {

                        id:
                            autoId,

                        title:
                            data.title,

                        summary:
                            data.summary,

                        content:
                            data.content,

                        category:
                            data.category,

                        status:
                            "draft",

                        breaking:
                            data.breaking,

                        image:
                            preview.querySelector(
                                "img"
                            )?.src || "",

                        updatedAt:
                            new Date().toISOString()

                    };


                    if (index !== -1) {

                        drafts[index] = {
                            ...drafts[index],
                            ...item
                        };

                    } else {

                        drafts.unshift(
                            item
                        );

                    }


                    saveDrafts(
                        drafts
                    );

                }


                /*
                 * Kullanıcı yazarken otomatik taslak
                 */

                [
                    titleInput,
                    summaryInput,
                    contentInput,
                    categoryInput
                ].forEach(
                    function (element) {

                        element.addEventListener(
                            "input",
                            function () {

                                clearTimeout(
                                    autoSaveTimer
                                );

                                autoSaveTimer =
                                    setTimeout(
                                        autoSaveDraft,
                                        3000
                                    );

                            }
                        );

                    }
                );


            });

    </script>

</body>
</html>
