<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="robots" content="noindex, nofollow">
  <title>Bağlantı Yok | Akçaabat Haber</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(21, 61, 107, 0.95), transparent 45%),
        #071525;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .offline {
      width: 100%;
      max-width: 560px;
      padding: 42px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: #fff;
      color: #0b1f3a;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    .signal {
      width: 46px;
      height: 46px;
      margin: 0 auto 20px;
      position: relative;
    }

    .signal::before,
    .signal::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 3px;
      transform: translateX(-50%);
      border: 4px solid #fff;
      border-bottom: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 50% 50% 0 0;
    }

    .signal::before {
      width: 42px;
      height: 30px;
    }

    .signal::after {
      width: 24px;
      height: 18px;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    p {
      max-width: 430px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.72);
      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button,
    a {
      min-height: 48px;
      padding: 13px 22px;
      border: 0;
      border-radius: 13px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .primary {
      background: #fff;
      color: #0b1f3a;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    button:hover,
    a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .brand {
      margin-top: 30px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .offline {
        padding: 34px 20px;
        border-radius: 22px;
      }

      .actions {
        flex-direction: column;
      }

      button,
      a {
        width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="portal-shell.css?v=15">
</head>

<body>
  <main class="offline">
    <div class="logo">AH</div>

    <div class="signal" aria-hidden="true"></div>

    <h1>Bağlantı Yok</h1>

    <p>
      İnternet bağlantınız şu anda kullanılamıyor.
      Bağlantınızı kontrol edip tekrar deneyebilirsiniz.
    </p>

    <div class="actions">
      <button
        class="primary"
        type="button"
        onclick="window.location.reload()">
        Tekrar Dene
      </button>

      <a class="secondary" href="/">
        Ana Sayfaya Dön
      </a>
    </div>

    <div class="brand">
      Akçaabat Haber
    </div>
  </main>
  <script src="portal-shell.js?v=15" defer></script>
</body>
</html>
