name: Update Akçaabat local services
on:
  push:
    paths:
      - .github/workflows/update-local-services.yml
      - .github/scripts/update_local_services.py
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: akcaabat-local-services
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python .github/scripts/update_local_services.py
      - name: Publish only changed data
        run: |
          if ! git diff --quiet -- data/yerel-hizmetler.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/yerel-hizmetler.json
            git commit -m 'Refresh Akçaabat local services'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
