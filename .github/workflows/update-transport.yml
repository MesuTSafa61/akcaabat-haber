name: Update Trabzon transport
on:
  push:
    paths:
      - .github/workflows/update-transport.yml
      - .github/scripts/update_transport.py
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trabzon-transport
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python .github/scripts/update_transport.py
      - name: Publish changed transport data
        run: |
          if ! git diff --quiet -- data/ulasim.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/ulasim.json
            git commit -m 'Refresh Trabzon bus and flight data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
