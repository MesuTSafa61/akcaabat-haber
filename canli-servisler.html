<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canlı Servisler Yönetimi</title></head>
<body><main><p><a href="admin-panel.html">← Yönetim paneli</a></p><h1>Canlı Servisler</h1><p id="status">Yükleniyor…</p>
<section><h2>Kamera ekle / düzenle</h2><form id="cameraForm">
<input id="cameraId" type="hidden"><label>Ad <input id="name" required></label><label>Şehir <select id="city"><option>Akçaabat</option><option>Trabzon</option></select></label>
<label>İlçe <input id="district"></label><label>Konum <input id="location"></label><label>Embed URL <input id="embedUrl" type="url" pattern="https://.*"></label><label>Akış URL <input id="streamUrl" type="url" pattern="https://.*"></label>
<label>Kaynak adı <input id="sourceName" required></label><label>Kaynak URL <input id="sourceUrl" type="url" required pattern="https://.*"></label><label>Sıra <input id="sortOrder" type="number" value="0"></label><label><input id="active" type="checkbox" checked> Aktif</label><button type="submit">Kaydet</button><button id="reset" type="button">Temizle</button>
</form><div id="cameras"></div></section>
<section><h2>Trafik sağlayıcısı</h2><p>API anahtarı burada tutulmaz. Yalnızca sağlayıcının izin verdiği herkese açık harita URL’sini girin.</p><form id="trafficForm"><label>Sağlayıcı <input id="provider"></label><label>Herkese açık harita URL <input id="mapUrl" type="url" pattern="https://.*"></label><label>Önbellek saniyesi <input id="cacheSeconds" type="number" min="30" max="900" value="60"></label><label><input id="trafficEnabled" type="checkbox"> Aktif</label><button>Kaydet</button></form></section>
</main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";let client;const $=id=>document.getElementById(id),msg=(t,e)=>{$("status").textContent=t;$("status").style.color=e?"#b91c1c":""},valid=v=>{try{return new URL(v).protocol==="https:"}catch(_){return false}},clear=()=>{$("cameraForm").reset();$("cameraId").value="";$("active").checked=true;$("sortOrder").value=0};
async function staff(){const{data:u}=await client.auth.getUser();if(!u.user)return false;const{data:p}=await client.from("profiles").select("role,is_active").eq("id",u.user.id).maybeSingle();return !!(p&&p.is_active&&["admin","editor"].includes(p.role))}
async function load(){const[a,b]=await Promise.all([client.from("live_cameras").select("*").order("city").order("sort_order"),client.from("live_service_settings").select("value").eq("key","traffic").single()]);if(a.error||b.error)throw Error();const c=b.data.value||{};$("provider").value=c.provider||"";$("mapUrl").value=c.public_map_url||"";$("cacheSeconds").value=c.cache_seconds||60;$("trafficEnabled").checked=!!c.enabled;$("cameras").innerHTML=a.data.length?"<ul>"+a.data.map(x=>"<li><b>"+x.name+"</b> ("+x.city+") <button data-edit='"+x.id+"'>Düzenle</button> <button data-toggle='"+x.id+"' data-active='"+x.is_active+"'>"+(x.is_active?"Kapat":"Aç")+"</button> <button data-delete='"+x.id+"'>Sil</button></li>").join("")+"</ul>":"<p>Doğrulanmış kamera eklenmedi.</p>";window.cameras=a.data}
$("cameraForm").onsubmit=async e=>{e.preventDefault();const embed=$("embedUrl").value.trim(),stream=$("streamUrl").value.trim(),source=$("sourceUrl").value.trim();if(!source||(!embed&&!stream)||[source,embed,stream].filter(Boolean).some(x=>!valid(x)))return msg("Yalnızca HTTPS URL kullanın.",true);const data={name:$("name").value.trim(),city:$("city").value,district:$("district").value.trim()||null,location:$("location").value.trim()||null,embed_url:embed||null,stream_url:stream||null,source_name:$("sourceName").value.trim(),source_url:source,sort_order:Number($("sortOrder").value)||0,is_active:$("active").checked};let r=$("cameraId").value?await client.from("live_cameras").update(data).eq("id",$("cameraId").value):await client.from("live_cameras").insert(data);if(r.error)return msg("Kamera kaydedilemedi.",true);clear();await load();msg("Kamera kaydedildi.")};
$("cameras").onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.toggle||e.target.dataset.delete;if(!id)return;const x=window.cameras.find(v=>v.id===id);if(e.target.dataset.edit){$("cameraId").value=x.id;["name","district","location","sourceName"].forEach(k=>$(k).value=x[({sourceName:"source_name"})[k]||k]||"");$("city").value=x.city;$("embedUrl").value=x.embed_url||"";$("streamUrl").value=x.stream_url||"";$("sourceUrl").value=x.source_url;$("sortOrder").value=x.sort_order;$("active").checked=x.is_active;return}if(e.target.dataset.delete){if(!confirm("Kamera silinsin mi?"))return;await client.from("live_cameras").delete().eq("id",id)}else await client.from("live_cameras").update({is_active:e.target.dataset.active!=="true"}).eq("id",id);await load()};
$("trafficForm").onsubmit=async e=>{e.preventDefault();const url=$("mapUrl").value.trim();if(url&&!valid(url))return msg("Yalnızca HTTPS URL kullanın.",true);const{error}=await client.from("live_service_settings").update({value:{enabled:$("trafficEnabled").checked,provider:$("provider").value.trim(),public_map_url:url,cache_seconds:Number($("cacheSeconds").value)||60},updated_at:new Date().toISOString()}).eq("key","traffic");if(error)msg("Trafik ayarı kaydedilemedi.",true);else msg("Trafik ayarı kaydedildi.")};$("reset").onclick=clear;
(async()=>{if(!window.supabase||!window.AKCAABAT_SUPABASE)throw Error();client=window.supabase.createClient(window.AKCAABAT_SUPABASE.url,window.AKCAABAT_SUPABASE.key);if(!await staff())return location.replace("admin-giris.html");await load();msg("Canlı servisler hazır.")})().catch(()=>msg("Sayfa açılamadı.",true))})();
</script></body></html>
