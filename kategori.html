<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kategori - Akçaabat Haber</title>
    <meta
        name="description"
        content="Akçaabat Haber kategori haberleri"
    >

    <link rel="stylesheet" href="style.css?v=3">

    <style>
        .category-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 35px 20px 70px;
        }

        .category-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 2px solid #0f766e;
        }

        .category-header h1 {
            margin: 0;
            font-size: 34px;
            color: #111827;
        }

        .category-header p {
            margin: 8px 0 0;
            color: #6b7280;
            font-size: 15px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .category-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,.08);
        }

        .category-image {
            display: block;
            width: 100%;
            height: 210px;
            background: #e5e7eb;
            overflow: hidden;
        }

        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .category-content {
            padding: 17px;
        }

        .category-name {
            display: inline-block;
            margin-bottom: 9px;
            color: #0f766e;
            font-size: 12px;
            font-weight: 700;
        }

        .category-card h2 {
            margin: 0;
            font-size: 19px;
            line-height: 1.35;
        }

        .category-card h2 a {
            color: #111827;
            text-decoration: none;
        }

        .category-card h2 a:hover {
            color: #0f766e;
        }

        .category-summary {
            margin: 9px 0 0;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.55;
        }

        .category-date {
            margin-top: 13px;
            color: #9ca3af;
            font-size: 11px;
        }

        .breaking {
            display: inline-block;
            margin-left: 6px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #dc2626;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
        }

        .loading,
        .empty,
        .error-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .loading {
            color: #6b7280;
        }

        .empty strong,
        .error-box strong {
            display: block;
            margin-bottom: 8px;
            color: #111827;
            font-size: 18px;
        }

        .empty span,
        .error-box span {
            color: #6b7280;
            font-size: 13px;
        }

        .error-box {
            color: #991b1b;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }

        .page-btn {
            border: 1px solid #d1d5db;
            background: #fff;
            color: #374151;
            padding: 9px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .page-btn:hover:not(:disabled) {
            border-color: #0f766e;
            color: #0f766e;
        }

        .page-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .page-number {
            min-width: 38px;
            text-align: center;
        }

        .category-count {
            margin-top: 5px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .category-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .category-page {
                padding: 25px 13px 55px;
            }

            .category-header h1 {
                font-size: 27px;
            }

            .category-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .category-image {
                height: 200px;
            }
        }
    </style>
  <link rel="stylesheet" href="portal-shell.css">
</head>

<body>

<header id="siteHeader"></header>

<main class="category-page">

    <div
        class="category-header"
        id="categoryHeader"
    >
        <h1 id="categoryTitle">Kategori</h1>

        <p id="categoryDescription">
            Haberler yükleniyor...
        </p>

        <div
            class="category-count"
            id="categoryCount"
        ></div>
    </div>

    <section
        class="category-grid"
        id="newsGrid"
    >
        <div class="loading">
            Haberler yükleniyor...
        </div>
    </section>

    <div
        class="pagination"
        id="pagination"
        style="display:none;"
    >
        <button
            type="button"
            class="page-btn"
            id="prevPage"
        >
            ← Önceki
        </button>

        <span
            class="page-number"
            id="pageNumber"
        >
            1
        </span>

        <button
            type="button"
            class="page-btn"
            id="nextPage"
        >
            Sonraki →
        </button>
    </div>

</main>

<footer id="siteFooter"></footer>

<script src="supabase-config.js"></script>
<script src="script.js?v=3"></script>

<script>
(function () {
    "use strict";

    const categoryTitle =
        document.getElementById("categoryTitle");

    const categoryDescription =
        document.getElementById("categoryDescription");

    const categoryCount =
        document.getElementById("categoryCount");

    const newsGrid =
        document.getElementById("newsGrid");

    const pagination =
        document.getElementById("pagination");

    const prevPage =
        document.getElementById("prevPage");

    const nextPage =
        document.getElementById("nextPage");

    const pageNumber =
        document.getElementById("pageNumber");

    const params =
        new URLSearchParams(window.location.search);

    const requestedSlug =
        params.get("slug") ||
        params.get("kategori") ||
        params.get("category") ||
        "";

    const requestedName =
        params.get("name") || "";

    let client = null;
    let category = null;
    let news = [];
    let currentPage = 1;

    const pageSize = 9;

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleDateString(
            "tr-TR",
            {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );
    }

    function normalizeSlug(value) {
        return String(value || "")
            .toLocaleLowerCase("tr-TR")
            .replace(/ğ/g, "g")
            .replace(/ü/g, "u")
            .replace(/ş/g, "s")
            .replace(/ı/g, "i")
            .replace(/ö/g, "o")
            .replace(/ç/g, "c")
            .replace(/â/g, "a")
            .replace(/î/g, "i")
            .replace(/û/g, "u")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");
    }

    function getImage(item) {
        if (item.image_url) {
            return item.image_url;
        }

        return "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450">' +
                '<rect width="100%" height="100%" fill="#e5e7eb"/>' +
                '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#6b7280" font-size="28">Akçaabat Haber</text>' +
                '</svg>'
            );
    }

    async function loadSupabase() {
        if (
            window.AkcaabatHaber &&
            window.AkcaabatHaber.getSupabaseClient
        ) {
            return window.AkcaabatHaber
                .getSupabaseClient();
        }

        if (
            window.supabase &&
            window.supabase.createClient
        ) {
            if (
                window.AKCAABAT_SUPABASE &&
                window.AKCAABAT_SUPABASE.url &&
                window.AKCAABAT_SUPABASE.key
            ) {
                return window.supabase.createClient(
                    window.AKCAABAT_SUPABASE.url,
                    window.AKCAABAT_SUPABASE.key
                );
            }
        }

        await new Promise(function (resolve, reject) {
            const script =
                document.createElement("script");

            script.src =
                "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

            script.onload = resolve;
            script.onerror = reject;

            document.head.appendChild(script);
        });

        if (
            !window.AKCAABAT_SUPABASE ||
            !window.AKCAABAT_SUPABASE.url ||
            !window.AKCAABAT_SUPABASE.key
        ) {
            throw new Error(
                "Supabase bağlantı ayarları bulunamadı."
            );
        }

        return window.supabase.createClient(
            window.AKCAABAT_SUPABASE.url,
            window.AKCAABAT_SUPABASE.key
        );
    }

    function normalizeCategory(row) {
        if (!row) {
            return null;
        }

        if (Array.isArray(row.categories)) {
            return row.categories[0] || null;
        }

        return row.categories || row;
    }

    async function findCategory() {
        let result;

        if (requestedSlug) {
            result =
                await client
                    .from("categories")
                    .select(
                        "id, name, slug, description, is_active"
                    )
                    .eq(
                        "slug",
                        normalizeSlug(
                            requestedSlug
                        )
                    )
                    .eq(
                        "is_active",
                        true
                    )
                    .maybeSingle();
        } else if (requestedName) {
            result =
                await client
                    .from("categories")
                    .select(
                        "id, name, slug, description, is_active"
                    )
                    .eq(
                        "name",
                        requestedName
                    )
                    .eq(
                        "is_active",
                        true
                    )
                    .maybeSingle();
        } else {
            return null;
        }

        if (result.error) {
            throw result.error;
        }

        return result.data;
    }

    async function loadNews() {
        if (!category) {
            return;
        }

        const result =
            await client
                .from("news")
                .select(`
                    id,
                    title,
                    slug,
                    summary,
                    image_url,
                    is_breaking,
                    views,
                    published_at,
                    created_at,
                    category_id,
                    categories (
                        id,
                        name,
                        slug
                    )
                `)
                .eq(
                    "status",
                    "published"
                )
                .eq(
                    "category_id",
                    category.id
                )
                .order(
                    "published_at",
                    {
                        ascending: false
                    }
                );

        if (result.error) {
            throw result.error;
        }

        news =
            (result.data || []).map(
                function (item) {
                    item.categories =
                        normalizeCategory(item);

                    return item;
                }
            );

        categoryCount.textContent =
            news.length +
            " yayınlanmış haber";

        render();
    }

    function render() {
        const total =
            news.length;

        const totalPages =
            Math.max(
                1,
                Math.ceil(
                    total / pageSize
                )
            );

        if (
            currentPage >
            totalPages
        ) {
            currentPage =
                totalPages;
        }

        const start =
            (currentPage - 1) *
            pageSize;

        const end =
            start + pageSize;

        const pageItems =
            news.slice(
                start,
                end
            );

        if (!pageItems.length) {
            newsGrid.innerHTML = `
                <div class="empty">
                    <strong>Bu kategoride henüz haber yok.</strong>
                    <span>Yeni haberler yayınlandığında burada görünecek.</span>
                </div>
            `;

            pagination.style.display =
                "none";

            return;
        }

        newsGrid.innerHTML =
            pageItems
                .map(renderCard)
                .join("");

        pagination.style.display =
            totalPages > 1
                ? "flex"
                : "none";

        pageNumber.textContent =
            currentPage +
            " / " +
            totalPages;

        prevPage.disabled =
            currentPage <= 1;

        nextPage.disabled =
            currentPage >= totalPages;
    }

    function renderCard(item) {
        const categoryName =
            item.categories &&
            item.categories.name
                ? item.categories.name
                : category.name;

        const breaking =
            item.is_breaking
                ? '<span class="breaking">SON DAKİKA</span>'
                : "";

        return `
            <article class="category-card">

                <a
                    class="category-image"
                    href="haber-detay.html?slug=${encodeURIComponent(item.slug)}"
                >
                    <img
                        src="${escapeHtml(getImage(item))}"
                        alt="${escapeHtml(item.title)}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                    >
                </a>

                <div class="category-content">

                    <span class="category-name">
                        ${escapeHtml(categoryName)}
                        ${breaking}
                    </span>

                    <h2>
                        <a
                            href="haber-detay.html?slug=${encodeURIComponent(item.slug)}"
                        >
                            ${escapeHtml(item.title)}
                        </a>
                    </h2>

                    <p class="category-summary">
                        ${escapeHtml(item.summary)}
                    </p>

                    <div class="category-date">
                        ${formatDate(item.published_at || item.created_at)}
                    </div>

                </div>

            </article>
        `;
    }

    function renderNotFound() {
        categoryTitle.textContent =
            "Kategori bulunamadı";

        categoryDescription.textContent =
            "Aradığınız kategori mevcut değil veya yayından kaldırılmış.";

        categoryCount.textContent = "";

        newsGrid.innerHTML = `
            <div class="empty">
                <strong>Kategori bulunamadı.</strong>
                <span>
                    Lütfen geçerli bir kategori bağlantısı kullanın.
                </span>
            </div>
        `;

        pagination.style.display =
            "none";
    }

    function renderError(error) {
        console.error(error);

        categoryTitle.textContent =
            "Bir hata oluştu";

        categoryDescription.textContent =
            "Haberler şu anda yüklenemiyor.";

        newsGrid.innerHTML = `
            <div class="error-box">
                <strong>Haberler yüklenemedi.</strong>
                <span>
                    ${escapeHtml(
                        error.message ||
                        "Bilinmeyen bir hata oluştu."
                    )}
                </span>
            </div>
        `;

        pagination.style.display =
            "none";
    }

    prevPage.addEventListener(
        "click",
        function () {
            if (currentPage > 1) {
                currentPage--;
                render();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }
    );

    nextPage.addEventListener(
        "click",
        function () {
            const totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        news.length /
                        pageSize
                    )
                );

            if (
                currentPage <
                totalPages
            ) {
                currentPage++;
                render();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }
    );

    async function init() {
        try {
            client =
                await loadSupabase();

            category =
                await findCategory();

            if (!category) {
                renderNotFound();
                return;
            }

            categoryTitle.textContent =
                category.name;

            categoryDescription.textContent =
                category.description ||
                category.name +
                " kategorisindeki güncel haberler.";

            document.title =
                category.name +
                " Haberleri - Akçaabat Haber";

            const metaDescription =
                document.querySelector(
                    'meta[name="description"]'
                );

            if (metaDescription) {
                metaDescription.setAttribute(
                    "content",
                    category.name +
                    " kategorisindeki güncel haberler - Akçaabat Haber"
                );
            }

            await loadNews();

        } catch (error) {
            renderError(error);
        }
    }

    init();

})();
</script>

  <script src="portal-shell.js?v=10" defer></script>
</body>
</html>
